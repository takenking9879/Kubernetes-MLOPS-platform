# ============================================================================
# REFERENCIA PARA DESARROLLADORES — NO SE USA EN RUNTIME
#
# A partir de la separación de params (2026-02-27), los archivos de ejecución
# reales son generados por el backend y subidos a S3 bajo params/{execution_id}/
#
#   params_preprocess.yaml  — config de Spark preprocessing (escrito por processing_runs.py)
#   params_training.yaml    — config de entrenamiento Ray (escrito por runs.py)
#   params_serving.yaml     — config de serving Ray Serve (escrito por runs.py)
#
# Este archivo (k3s/params.yaml) es leído en runtime únicamente por:
#   - k3s/spark/inference/kafka_main.py (Kafka streaming job, runs continuously)
#
# Solo quedan aquí los campos de dominio INFERENCE que kafka_main.py lee:
#   spark.streaming.* — micro-batch timing, offsets
#   spark.checkpoint.* — Spark streaming checkpoint location
#   spark.operational.* — connection health checks
#   spark.prediction.ray_serve.* — Ray Serve endpoint, batch, timeout, retries
#
# CAMPOS ELIMINADOS (anti-patterns detectados en auditoría 2026-02-27):
#   spark.schemas.*         → constantes internas del SchemaRegistry (hardcoded en kafka_main.py)
#   spark.converters.*      → un único converter existe; hardcoded en kafka_main.py
#   spark.prediction.columns.prediction_column → siempre 'label'; constante del sistema
#   spark.prediction.columns.id_column → ahora en raw.yaml::id_field
#   spark.output.*          → derivado de raw.yaml + prediction_column
#   spark.app_name          → constante en kafka_main.py (_APP_NAME)
#   spark.num_classes       → duplicado de model.num_classes; constante en kafka_main.py
#   spark.target            → duplicado de model.target
#   spark.read_batch_size   → tuning operacional, no afecta reproducibilidad ML
#   spark.write_batch_size  → idem
#
# Static infrastructure config lives in k3s/config.yaml.
# ============================================================================

# ---- Execution identity (set by UI / Airflow) ----
execution:
  execution_id: ""          # e.g. "20260223_120000"
  raw_table: ""             # e.g. "iceberg.raw.network_traffic"
  dsl_s3_path: ""           # e.g. "s3://k8s-mlops-platform-bucket/dsl/dsl_network_traffic/v1.yaml"

# ---- Time splits ----
splits:
  train:
    start: "2026-01-01 00:30:00"
    end:   "2026-01-01 13:00:00"

  val:
    start: "2026-01-01 13:00:00"
    end:   "2026-01-02 05:40:00"

  test:
    start: "2026-01-02 07:00:00"
    end:   "2026-01-03 03:50:00"

# ---- Model selection and training ----
model:
  framework: "xgboost"          # "xgboost" | "pytorch"
  experiment_name: "kuberay-attack-detection"
  registry_model_name: "attack-detection"
  target: "attack"
  num_classes: 6
  tune: true
  sample_fraction_for_tuning: 0.2
  seed: 42
  # artifact_location = config.mlflow.artifact_base + "/" + experiment_name (derived at runtime)

# ---- Hyperparameter overrides (validated against allowed keys in src/schemas/model/) ----
# Only keys already defined in the Python defaults are accepted.
# Leave a section empty ({}) to use all defaults.
hyperparams:
  xgboost:
    num_boost_round: 60
    objective: "multi:softprob"
    eval_metric: ["mlogloss", "merror"]
    booster: "gbtree"
    tree_method: "hist"
    verbosity: 1
    eta: 0.3
    max_depth: 6
    min_child_weight: 1
    subsample: 1.0
    lambda: 1.0
    alpha: 0.0

  pytorch:
    batch_size: 256
    max_epochs: 50
    lr: 0.001
    weight_decay: 0.0

# ============================================================================
# BACKWARD-COMPATIBILITY BLOCK
# The serving layer (src/serve/config.py) and Spark jobs still read from
# kuberay.* and spark.* keys. These are kept here until ConfigLoader.load()
# is updated to merge config.yaml + params.yaml transparently.
# ============================================================================

kuberay:
  model:
    tune: true
    sample_fraction_for_tuning: 0.2 # Realiza un muestreo estratificado para acelerar el tuning
    target: "attack"
    num_classes: 6
    dsl_count_dim: true # Usar DSL para contar columnas de entrada
    input_dim: 14
    framework: "xgboost" # "pytorch", "xgboost"
    seed: 42
    mlflow_tracking_uri: "http://my-mlflow"
    mlflow_experiment_name: "kuberay-attack-detection"
    mlflow_artifact_location: "s3://k8s-mlops-platform-bucket/mlflow-artifacts/"
    mlflow_registry_model_name: "attack-detection"

  serving:
    alias: "champion" # MLflow Model Registry alias (champion = production model)
    canary: false
    webhook_public_base_url: "http://model-serving-serve-svc.ray.svc.cluster.local:8000"
    webhook_path: "/infer/webhook"
    webhook_name: "rayserve-attack-detection-champion-alias"
    webhook_max_timestamp_age_seconds: 300

  canary:
    alias: "challenger" # MLflow Model Registry alias for canary
    canary_probability: 0.10
    initial_replicas: 0

# ============================================================================
# SPARK INFERENCE CONFIG — read by kafka_main.py (streaming job)
#
# Only inference-domain fields remain here.
# Fields removed (see header above): schemas, converters, output, prediction.columns,
# app_name, num_classes, target, read_batch_size, write_batch_size.
# ============================================================================

spark:
  preprocessing:
    dsl_path: "/app/repo/k3s/spark/preprocess/dsl_001.yaml"
    artifacts:
      bucket: "k8s-mlops-platform-bucket"
      archives: ["config.json", "stages.json"]

  # bucket: used by spark/main.py for schema S3 auto-discovery
  bucket: "k8s-mlops-platform-bucket"

  # iceberg warehouse: fallback for spark/main.py catalog
  iceberg:
    warehouse: "s3a://k8s-mlops-platform-bucket/warehouse"

  prediction:
    type: "ray_serve"
    ray_serve:
      url: "http://model-serving-serve-svc.ray.svc.cluster.local:8000/infer"
      batch_size: 100
      timeout: 30
      max_retries: 3
      request_payload_format: "list"
      response_format: "json"
      prediction_key: "predictions"

  streaming:
    online_processing_time: "250 milliseconds"
    starting_offsets: "latest"
    fail_on_data_loss: false

  checkpoint:
    location: "s3a://k8s-mlops-platform-bucket/checkpoints/kafka-spark-inference"
    cleanup_on_exit: false

  operational:
    check_kafka_connection: true
    log_level: "INFO"

iceberg_tables:
  warehouse: "s3://k8s-mlops-platform-bucket/warehouse"

  raw:
    catalog: "iceberg"
    namespace: "raw"
    table: "network_traffic"
    full_name: "iceberg.raw.network_traffic"

  metadata:
    catalog: "iceberg"
    namespace: "metadata"
    table: "preprocessing_artifacts"
    full_name: "iceberg.metadata.preprocessing_artifacts"

  processed:
    catalog: "iceberg"
    namespace: "processed"
    # Tables created as: iceberg.processed.{raw_table}_{artifact_id}
    # e.g.              iceberg.processed.network_traffic_20260223_050000
