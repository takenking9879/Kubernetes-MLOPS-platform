kafka:
  output_topic: "fraud_predictions"
  security_protocol: 'SASL_PLAINTEXT'
  sasl_mechanism: 'SCRAM-SHA-512'

# ============================================================================
# SPLITS CONFIGURATION - Rangos de fechas para train/val/test
# ============================================================================
splits:
  train:
    start: "2026-01-01 00:30:00"
    end:   "2026-01-01 13:00:00"

  val:
    start: "2026-01-01 13:00:00"
    end:   "2026-01-02 05:40:00"

  test:
    start: "2026-01-02 07:00:00"
    end:   "2026-01-03 03:50:00"

kuberay:
  model:
    #num_data_blocks: 4  # Número de bloques para leer los datos con Ray Datasets, None =  default
    tune: true
    sample_fraction_for_tuning: 0.2 # Realiza un muestreo estratificado para acelerar el tuning
    target: "attack"
    num_classes: 6
    dsl_count_dim: true  # Usar DSL para contar columnas de entrada
    input_dim: 14
    framework: "xgboost"  # "pytorch", "xgboost"
    seed: 42
    mlflow_tracking_uri: "http://my-mlflow"
    mlflow_experiment_name: "kuberay-attack-detection"
    mlflow_artifact_location: "s3://k8s-mlops-platform-bucket/mlflow-artifacts/"
    mlflow_registry_model_name: "attack-detection"  # Name in MLflow Model Registry (optional, defaults to experiment name)
    
  serving:
    alias: "champion"  # MLflow Model Registry alias (champion = production model)
    canary: false
    # online: true  → Ray Serve handles full preprocessing (NumPy DSL) + prediction.
    #                  Pipeline artifacts are resolved via MLflow → Iceberg → S3.
    #                  MLflow webhook is registered for fast model + executor reload.
    # online: false → Ray Serve only runs the ML model; Spark preprocesses upstream.
    online: false
    webhook_public_base_url: "http://serving.localhost"
    webhook_path: "/infer/webhook"
    webhook_name: "rayserve-attack-detection-champion-alias"
    webhook_max_timestamp_age_seconds: 300

  # Optional per-deployment canary configuration. When present, `CanaryModel`
  # will pick these values (overrides `kuberay.serving` / `kuberay.model`).
  # Example: set `initial_replicas: 0` to keep canary inactive until you scale it.
  canary:
    alias: "challenger"  # MLflow Model Registry alias for canary
    canary_probability: 0.10
    # initial_replicas controls whether a canary instance is started automatically
    initial_replicas: 0

spark:
  app_name: "spark-preprocessing"
  bucket: "k8s-mlops-platform-bucket" # dummy bucket name
  read_batch_size: 512  # Max MB read into memory per batch
  write_batch_size: 100000  # Max lines written to S3 per batch
  num_classes: 6
  target: "attack"
  # ===== SCHEMAS CONFIGURATION =====
  # Nombres de schemas definidos en schema/schemas.py
  schemas:
    input_schema: "kafka_schema_features"     # Schema para parsear Kafka
    features_schema: "schema_features"        # Schema después de conversión
    output_schema: "prediction_schema"        # Schema de predicciones
    preprocessed_schema: "schema_preprocessed" # Schema después de preprocessing
    full_schema: "schema_full"              # Schema completo (features + label)
  
  # ===== CONVERTERS CONFIGURATION =====
  # Nombres de funciones definidas en helpers/spark_kafka_helper.py
  converters:
    kafka_to_features: "kafka_to_schema_features"
    # Puedes agregar más conversores aquí:
    # features_to_another: "another_converter_function"
  
  # ===== PREPROCESSING CONFIGURATION =====
  preprocessing:
    # Configuración de artefactos (scalers, encoders, etc.)
    artifacts:
      source: "s3"  # s3, local, minio
      bucket: "k8s-mlops-platform-bucket"
      key: "v1/artifacts"
      archives:
        - "config.json"
        - "stages.json"
    # Opciones para la tabla procesada
    processed:
      # Especificar particionado Iceberg, por ejemplo: "days(timestamp)", "months(timestamp)", "hours(timestamp)"
      partition: "days(timestamp)"
  
  # ===== PREDICTION CONFIGURATION =====
  prediction:
    type: "ray_serve"  # ray_serve, http, sagemaker, custom
    
    # Configuración específica de Ray Serve
    ray_serve:
      url: "http://model-serving-serve-svc.ray.svc.cluster.local:8000/infer"
      batch_size: 100
      timeout: 30
      max_retries: 3
      request_payload_format: "list"  # list, dict
      response_format: "json"
      prediction_key: "predictions"   # Key en la respuesta JSON
    
    # Configuración de columnas
    columns:
      id_column: "event_id"
      prediction_column: "label"
  
  # ===== OUTPUT CONFIGURATION =====
  output:
    format: "json"  # json, avro, protobuf
    key_column: "event_id"
    # Columnas a incluir en la salida (o "all" para todas)
    value_columns:
      - "timestamp"
      - "event_id"
      - "properties"
      - "label"
  
  # ===== CHECKPOINT CONFIGURATION =====
  checkpoint:
    location: "s3a://k8s-mlops-platform-bucket/checkpoints/kafka-spark-inference"
    cleanup_on_exit: false
  
  # ===== OPERATIONAL CONFIGURATION =====
  operational:
    check_kafka_connection: true
    check_storage_connection: true
    log_level: "INFO"

  streaming:
    max_offsets_per_trigger: 10000
    processing_time: "10 seconds"
    starting_offsets: "latest"
    fail_on_data_loss: false

# ============================================================================
# ICEBERG TABLES CONFIGURATION
# ============================================================================
iceberg_tables:

  warehouse: "s3://k8s-mlops-platform-bucket/warehouse" # Ruta al warehouse de Iceberg en S3

  # Tabla de raw data
  raw:
    catalog: "iceberg"
    namespace: "raw"
    table: "network_traffic_raw"
    full_name: "iceberg.raw.network_traffic_raw"
  
  # Tabla de metadata
  metadata:
    catalog: "iceberg"
    namespace: "metadata"
    table: "preprocessing_artifacts"
    full_name: "iceberg.metadata.preprocessing_artifacts"
  
  # Namespace para tablas procesadas
  processed:
    catalog: "iceberg"
    namespace: "processed"
    # Las tablas procesadas se crearán dinámicamente con formato:
    # iceberg.processed.{artifact_set_id}
    # cambiar a iceberg.processed.{network_traffic}
