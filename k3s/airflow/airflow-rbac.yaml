# RBAC for the Airflow scheduler service account.
#
# The scheduler submits and polls SparkApplication CRs (spark namespace) and
# RayJob CRs (ray namespace) on behalf of the ml_pipeline DAG.
#
# Service account: system:serviceaccount:airflow:my-airflow-scheduler
# (matches the Helm release name "my-airflow" + default scheduler SA suffix)

---
# ── Spark namespace ──────────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-spark-role
  namespace: spark
rules:
  - apiGroups: ["spark.apache.org"]
    resources: ["sparkapplications"]
    verbs: ["create", "delete", "get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-spark-rolebinding
  namespace: spark
subjects:
  - kind: ServiceAccount
    name: my-airflow-scheduler
    namespace: airflow
roleRef:
  kind: Role
  name: airflow-spark-role
  apiGroup: rbac.authorization.k8s.io

---
# ── Airflow namespace — pod management for KubernetesPodOperator ──────────────
# KubernetesPodOperator (used by sky-runner DAGs) needs to create, watch,
# and delete pods in the airflow namespace from the scheduler service account.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-pod-runner-role
  namespace: airflow
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-pod-runner-rolebinding
  namespace: airflow
subjects:
  - kind: ServiceAccount
    name: my-airflow-scheduler
    namespace: airflow
roleRef:
  kind: Role
  name: airflow-pod-runner-role
  apiGroup: rbac.authorization.k8s.io

---
# ── Ray namespace ─────────────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-ray-role
  namespace: ray
rules:
  - apiGroups: ["ray.io"]
    resources: ["rayjobs"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: ["ray.io"]
    resources: ["rayservices"]
    verbs: ["get", "patch", "create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-ray-rolebinding
  namespace: ray
subjects:
  - kind: ServiceAccount
    name: my-airflow-scheduler
    namespace: airflow
roleRef:
  kind: Role
  name: airflow-ray-role
  apiGroup: rbac.authorization.k8s.io
