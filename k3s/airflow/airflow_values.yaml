executor: "LocalExecutor"

images:
  airflow:
    repository: apache/airflow-k8s
    tag: latest
    pullPolicy: IfNotPresent

fernetKey: VnBXNmNoRE1HU3dIUTR3MFlBM3NlWHV0UUtwQTdoSmk=
webserverSecretKey: 9d13b9cf8abdd54558e84d7d26e6423b

# PostgreSQL integrado
postgresql:
  image:
    tag: "latest"

dags:
  gitSync:
    enabled: true
    repo: "https://github.com/takenking9879/Kubernetes-MLOPS-platform"
    branch: "main"
    subPath: "k3s/airflow/dags"
  persistence:
    enabled: false


#workers:
  #replicas: 1

dagProcessor:
  replicas: 1
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

scheduler:
  replicas: 1
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2Gi"

triggerer:
  replicas: 1
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

statsd:
  enabled: false
# ==========================================================
# ESTRUCTURA SOLICITADA: extraEnv directamente bajo el componente
# (Esto podría causar el error anterior, pero es la estructura pedida)
# ==========================================================
extraEnv: |
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: AWS_ACCESS_KEY_ID

  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: AWS_SECRET_ACCESS_KEY
  
  - name: AWS_REGION
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: AWS_REGION
  
  - name: MLFLOW_TRACKING_URI
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: MLFLOW_TRACKING_URI
        
  - name: SKYPILOT_API_SERVER_ENDPOINT
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: SKYPILOT_API_SERVER_ENDPOINT
  
  - name: METRICS_REMOTE_WRITE_URL
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: METRICS_REMOTE_WRITE_URL

  - name: METRICS_REMOTE_WRITE_USERNAME
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: METRICS_REMOTE_WRITE_USERNAME

  - name: METRICS_REMOTE_WRITE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: METRICS_REMOTE_WRITE_PASSWORD