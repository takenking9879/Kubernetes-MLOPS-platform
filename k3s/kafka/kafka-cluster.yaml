apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  labels:
    strimzi.io/cluster: my-kafka-cluster
  namespace: kafka
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 100Gi
        deleteClaim: false
        kraftMetadata: shared
---

apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: my-kafka-cluster
  namespace: kafka
spec:
  kafka:
    authorization:
      type: simple
    version: 4.1.1
    metadataVersion: 4.1-IV1
    listeners:
      - name: plain
        port: 9092
        type: nodeport
        tls: false
        authentication:
          type: scram-sha-512
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: scram-sha-512
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
    # ===== PROMETHEUS METRICS (Strimzi Metrics Reporter) =====
    metricsConfig:
      type: strimziMetricsReporter
      values:
        allowList:
          - "kafka.server:type=BrokerTopicMetrics,.*"
          - "kafka.server:type=ReplicaManager,.*"
          - "kafka.controller:type=KafkaController,.*"
          - "kafka.network:type=RequestMetrics,.*"
          - "kafka.log:type=LogFlushStats,.*"
  entityOperator:
    topicOperator: {}
    userOperator: {}
  # ===== KAFKA EXPORTER (for consumer group lag) =====
  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi