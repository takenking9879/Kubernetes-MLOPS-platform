apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: topic-traffic
  labels:
    strimzi.io/cluster: my-kafka-cluster
  namespace: kafka
spec:
  topicName: topic-traffic
  partitions: 6
  replicas: 1
  config:
    # Keep traffic topic short-lived to avoid storage growth from raw events
    cleanup.policy: delete
    retention.ms: 3600000

---

apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: topic-prediction
  labels:
    strimzi.io/cluster: my-kafka-cluster
  namespace: kafka
spec:
  topicName: topic-prediction
  partitions: 6
  replicas: 1
  config:
    # Predictions are kept longer but still bounded
    cleanup.policy: delete
    retention.ms: 7200000
