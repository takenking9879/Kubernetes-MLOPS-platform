apiVersion: v1
kind: Service
metadata:
  name: my-kafka-cluster-kafka-exporter
  namespace: kafka
  labels:
    app.kubernetes.io/name: kafka-exporter
    app.kubernetes.io/instance: my-kafka-cluster
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kafka-exporter
    app.kubernetes.io/instance: my-kafka-cluster
  ports:
    - name: metrics
      port: 9404
      targetPort: tcp-prometheus
      protocol: TCP
