fields:
  - {name: timestamp, type: string, nullable: true}
  - {name: event_id,  type: string, nullable: false}
  - name: properties
    type: struct
    nullable: false
    fields:
      - {name: src_port,          type: long,   nullable: true}
      - {name: dst_port,          type: long,   nullable: true}
      - {name: protocol,          type: string, nullable: true}
      - {name: packet_count,      type: long,   nullable: true}
      - {name: conn_state,        type: string, nullable: true}
      - {name: bytes_transferred, type: double, nullable: true}
