# ============================================================
# RunPod + Tailscale credentials for the GPU training pipeline
#
# USAGE:
#   1. Fill in all placeholder values below.
#   2. Apply to the cluster:
#        kubectl apply -f k3s/runpod/runpod-secrets.yaml
#   3. The training_dag_gpu.py DAG reads these values at runtime
#      via Airflow Variables or directly from this Secret.
#
# NEVER commit this file with real credentials.
# Use a secrets manager (Vault, AWS Secrets Manager, Sealed Secrets)
# for production environments.
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: runpod-secrets
  namespace: ray
type: Opaque
stringData:
  # ── RunPod ──────────────────────────────────────────────────────────────────
  # API key from https://www.runpod.io/console/user/settings → API Keys
  RUNPOD_API_KEY: "<your-runpod-api-key>"

  # Default GPU type for training jobs.
  # Examples: "NVIDIA RTX 4090", "NVIDIA A100 80GB", "NVIDIA H100 80GB PCIe"
  RUNPOD_GPU_TYPE: "NVIDIA RTX 4090"

  # Docker image pushed to a registry accessible from RunPod.
  # Build with: docker build -f k3s/runpod/Dockerfile.runpod-gpu \
  #               -t <your-registry>/ray-cluster-gpu:2.53.0 .
  RUNPOD_IMAGE: "<your-registry>/ray-cluster-gpu:2.53.0"

  # ── Tailscale ───────────────────────────────────────────────────────────────
  # OAuth client ID from https://login.tailscale.com/admin/settings/oauth
  # The client needs "write" permission on "auth keys".
  TAILSCALE_CLIENT_ID: "<your-tailscale-oauth-client-id>"

  # OAuth client secret (paired with TAILSCALE_CLIENT_ID above)
  TAILSCALE_CLIENT_SECRET: "<your-tailscale-oauth-client-secret>"

  # Your tailnet name. Use "-" for personal accounts.
  # For GitHub-connected orgs: "your-org.github"
  TAILSCALE_TAILNET: "<your-tailnet>"
