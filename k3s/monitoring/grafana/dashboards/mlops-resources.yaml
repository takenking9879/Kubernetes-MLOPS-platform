apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-mlops-resources
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  mlops-resources.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "grafana", "uid": "-- Grafana --" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "panels": [],
          "title": "Cluster Overview",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 90 }
                ]
              },
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          },
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 1 },
          "id": 2,
          "title": "Cluster GPU Utilization %",
          "type": "gauge",
          "targets": [
            {
              "expr": "avg(skypilot_gpu_utilization_pct{cluster=~\"$sky_cluster\"})",
              "legendFormat": "GPU %"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 90 }
                ]
              },
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          },
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 1 },
          "id": 3,
          "title": "Cluster Memory Utilization %",
          "type": "gauge",
          "targets": [
            {
              "expr": "100 * sum(container_memory_working_set_bytes{namespace=~\"$namespace\"}) / sum(kube_pod_container_resource_limits{namespace=~\"$namespace\", resource=\"memory\"})",
              "legendFormat": "Memory %"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 3 }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 1 },
          "id": 4,
          "title": "Ray Pod Restarts (last 15m)",
          "type": "stat",
          "targets": [
            {
              "expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\", pod=~\"$ray_pod\"}[15m]))",
              "legendFormat": "{{ pod }}"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 7 },
          "id": 10,
          "panels": [],
          "title": "SkyPilot GPU Workers",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" },
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "id": 11,
          "title": "GPU Utilization % by Device",
          "type": "timeseries",
          "targets": [
            {
              "expr": "skypilot_gpu_utilization_pct{cluster=~\"$sky_cluster\"}",
              "legendFormat": "{{ cluster }} gpu{{ gpu }} (spot={{ is_spot }})"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 90 }
                ]
              },
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "id": 12,
          "title": "GPU Memory Utilization %",
          "type": "bargauge",
          "options": { "orientation": "horizontal" },
          "targets": [
            {
              "expr": "100 * skypilot_gpu_memory_used_mb{cluster=~\"$sky_cluster\"} / skypilot_gpu_memory_total_mb{cluster=~\"$sky_cluster\"}",
              "legendFormat": "{{ cluster }} gpu{{ gpu }}"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" },
              "unit": "decmbytes"
            }
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "id": 13,
          "title": "GPU Memory Used vs Total (MB)",
          "type": "timeseries",
          "targets": [
            {
              "expr": "skypilot_gpu_memory_used_mb{cluster=~\"$sky_cluster\"}",
              "legendFormat": "{{ cluster }} gpu{{ gpu }} used"
            },
            {
              "expr": "skypilot_gpu_memory_total_mb{cluster=~\"$sky_cluster\"}",
              "legendFormat": "{{ cluster }} gpu{{ gpu }} total"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 24 },
          "id": 20,
          "panels": [],
          "title": "Ray Cluster — Memory",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" },
              "unit": "bytes"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 25 },
          "id": 21,
          "title": "Memory Working Set",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=~\"$namespace\", pod=~\"$ray_pod\"})",
              "legendFormat": "{{ pod }}"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" },
              "unit": "bytes"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 25 },
          "id": 22,
          "title": "Memory vs Limit",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=~\"$namespace\", pod=~\"$ray_pod\"})",
              "legendFormat": "{{ pod }} working set"
            },
            {
              "expr": "sum by (pod) (kube_pod_container_resource_requests{namespace=~\"$namespace\", pod=~\"$ray_pod\", resource=\"memory\"})",
              "legendFormat": "{{ pod }} request"
            },
            {
              "expr": "sum by (pod) (kube_pod_container_resource_limits{namespace=~\"$namespace\", pod=~\"$ray_pod\", resource=\"memory\"})",
              "legendFormat": "{{ pod }} limit"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 3 }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 33 },
          "id": 23,
          "title": "OOM Kills — Ray Pods (restarts in last 5m)",
          "type": "timeseries",
          "targets": [
            {
              "expr": "increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\", pod=~\"$ray_pod\"}[5m])",
              "legendFormat": "{{ pod }}"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 41 },
          "id": 50,
          "panels": [],
          "title": "SkyPilot GPU Fleet",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "description": "Average GPU utilization split by spot/on-demand workers.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "percent",
              "min": 0
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 42 },
          "id": 51,
          "title": "Spot vs On-Demand GPU Utilization %",
          "type": "bargauge",
          "options": { "orientation": "horizontal", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [
            {
              "expr": "avg(skypilot_gpu_utilization_pct{cluster=~\"$sky_cluster\", is_spot=\"true\"})",
              "legendFormat": "spot"
            },
            {
              "expr": "avg(skypilot_gpu_utilization_pct{cluster=~\"$sky_cluster\", is_spot=\"false\"})",
              "legendFormat": "on-demand"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "description": "Total GPU memory in use by SkyPilot cluster.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "decmbytes",
              "min": 0
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 42 },
          "id": 52,
          "title": "GPU Memory Used by Cluster (MB)",
          "type": "bargauge",
          "options": { "orientation": "horizontal", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [
            {
              "expr": "sum by (cluster) (skypilot_gpu_memory_used_mb{cluster=~\"$sky_cluster\"})",
              "legendFormat": "{{ cluster }}"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 50 },
          "id": 30,
          "panels": [],
          "title": "Ray Object Store (requires Ray metrics exporter on head :8080)",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" },
              "unit": "bytes"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 51 },
          "id": 31,
          "title": "Ray Object Store Memory",
          "description": "Requires Ray's built-in Prometheus exporter enabled on the head node (ray_object_store_memory metric).",
          "type": "timeseries",
          "targets": [
            {
              "expr": "ray_object_store_memory{namespace=~\"$namespace\"}",
              "legendFormat": "{{ pod }}"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" },
              "unit": "short"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 51 },
          "id": 32,
          "title": "Ray Spilled Objects",
          "description": "Requires Ray's built-in Prometheus exporter. Shows objects spilled to disk when object store is full.",
          "type": "timeseries",
          "targets": [
            {
              "expr": "ray_object_store_num_spilled_objects{namespace=~\"$namespace\"}",
              "legendFormat": "{{ pod }}"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 59 },
          "id": 40,
          "panels": [],
          "title": "Disk & Network",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" },
              "unit": "percentunit"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 60 },
          "id": 41,
          "title": "Node I/O Wait",
          "type": "timeseries",
          "targets": [
            {
              "expr": "rate(node_cpu_seconds_total{mode=\"iowait\", instance=~\"$node\"}[2m])",
              "legendFormat": "{{ instance }}"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" },
              "unit": "Bps"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 60 },
          "id": 42,
          "title": "Network I/O — Ray Pods",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum by (pod) (rate(container_network_receive_bytes_total{namespace=~\"$namespace\", pod=~\"$ray_pod\"}[2m]))",
              "legendFormat": "{{ pod }} rx"
            },
            {
              "expr": "sum by (pod) (rate(container_network_transmit_bytes_total{namespace=~\"$namespace\", pod=~\"$ray_pod\"}[2m]))",
              "legendFormat": "{{ pod }} tx"
            }
          ]
        }
      ],
      "schemaVersion": 39,
      "tags": ["mlops", "resources", "ray"],
      "templating": {
        "list": [
          {
            "current": { "selected": false, "text": "Prometheus", "value": "Prometheus" },
            "hide": 0,
            "includeAll": false,
            "name": "DS_PROMETHEUS",
            "query": "prometheus",
            "type": "datasource"
          },
          {
            "current": {},
            "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
            "definition": "label_values(kube_pod_info, namespace)",
            "hide": 0,
            "includeAll": true,
            "multi": true,
            "name": "namespace",
            "query": "label_values(kube_pod_info, namespace)",
            "refresh": 2,
            "regex": "^(ray|spark|serving|apps)$",
            "sort": 1,
            "type": "query"
          },
          {
            "current": {},
            "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
            "definition": "label_values(kube_pod_info{namespace=~\"$namespace\"}, pod)",
            "hide": 0,
            "includeAll": true,
            "multi": true,
            "name": "ray_pod",
            "label": "Ray Pod",
            "query": "label_values(kube_pod_info{namespace=~\"$namespace\"}, pod)",
            "refresh": 2,
            "regex": ".*(?:head|worker|submitter).*",
            "sort": 1,
            "type": "query"
          },
          {
            "allValue": ".*",
            "current": {
              "selected": false,
              "text": "All",
              "value": "$__all"
            },
            "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
            "definition": "label_values(skypilot_gpu_utilization_pct, cluster)",
            "hide": 0,
            "includeAll": true,
            "multi": true,
            "name": "sky_cluster",
            "label": "SkyPilot Cluster",
            "query": "label_values(skypilot_gpu_utilization_pct, cluster)",
            "refresh": 2,
            "sort": 1,
            "type": "query"
          },
          {
            "current": {},
            "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
            "definition": "label_values(kube_pod_info{namespace=~\"$namespace\"}, node)",
            "hide": 0,
            "includeAll": true,
            "multi": true,
            "name": "node",
            "query": "label_values(kube_pod_info{namespace=~\"$namespace\"}, node)",
            "refresh": 2,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "MLOps Worker Resources",
      "uid": "mlops-worker-resources",
      "version": 3
    }
