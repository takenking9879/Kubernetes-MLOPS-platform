apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-mlops-resources
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  mlops-resources.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "grafana", "uid": "-- Grafana --" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "panels": [],
          "title": "Cluster Overview",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 90 }
                ]
              },
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          },
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 1 },
          "id": 2,
          "title": "Cluster CPU Utilization %",
          "type": "gauge",
          "targets": [
            {
              "expr": "100 * sum(rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\"}[2m])) / sum(kube_pod_container_resource_limits{namespace=~\"$namespace\", resource=\"cpu\"})",
              "legendFormat": "CPU %"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 90 }
                ]
              },
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          },
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 1 },
          "id": 3,
          "title": "Cluster Memory Utilization %",
          "type": "gauge",
          "targets": [
            {
              "expr": "100 * sum(container_memory_working_set_bytes{namespace=~\"$namespace\"}) / sum(kube_pod_container_resource_limits{namespace=~\"$namespace\", resource=\"memory\"})",
              "legendFormat": "Memory %"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 3 }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 1 },
          "id": 4,
          "title": "Ray Pod Restarts (last 15m)",
          "type": "stat",
          "targets": [
            {
              "expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\", pod=~\"$ray_pod\"}[15m]))",
              "legendFormat": "{{ pod }}"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 7 },
          "id": 10,
          "panels": [],
          "title": "Ray Cluster — CPU",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" },
              "unit": "short"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "id": 11,
          "title": "CPU Usage (cores)",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\", pod=~\"$ray_pod\"}[2m]))",
              "legendFormat": "{{ pod }}"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 90 }
                ]
              },
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "id": 12,
          "title": "CPU Utilization % (usage / limit)",
          "type": "bargauge",
          "options": { "orientation": "horizontal" },
          "targets": [
            {
              "expr": "100 * sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\", pod=~\"$ray_pod\"}[2m])) / sum by (pod) (kube_pod_container_resource_limits{namespace=~\"$namespace\", pod=~\"$ray_pod\", resource=\"cpu\"})",
              "legendFormat": "{{ pod }}"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" },
              "unit": "short"
            }
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "id": 13,
          "title": "CPU Request vs Actual",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum by (pod) (kube_pod_container_resource_requests{namespace=~\"$namespace\", pod=~\"$ray_pod\", resource=\"cpu\"})",
              "legendFormat": "{{ pod }} request"
            },
            {
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\", pod=~\"$ray_pod\"}[2m]))",
              "legendFormat": "{{ pod }} actual"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 24 },
          "id": 20,
          "panels": [],
          "title": "Ray Cluster — Memory",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" },
              "unit": "bytes"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 25 },
          "id": 21,
          "title": "Memory Working Set",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=~\"$namespace\", pod=~\"$ray_pod\"})",
              "legendFormat": "{{ pod }}"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" },
              "unit": "bytes"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 25 },
          "id": 22,
          "title": "Memory vs Limit",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=~\"$namespace\", pod=~\"$ray_pod\"})",
              "legendFormat": "{{ pod }} working set"
            },
            {
              "expr": "sum by (pod) (kube_pod_container_resource_requests{namespace=~\"$namespace\", pod=~\"$ray_pod\", resource=\"memory\"})",
              "legendFormat": "{{ pod }} request"
            },
            {
              "expr": "sum by (pod) (kube_pod_container_resource_limits{namespace=~\"$namespace\", pod=~\"$ray_pod\", resource=\"memory\"})",
              "legendFormat": "{{ pod }} limit"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 3 }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 33 },
          "id": 23,
          "title": "OOM Kills — Ray Pods (restarts in last 5m)",
          "type": "timeseries",
          "targets": [
            {
              "expr": "increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\", pod=~\"$ray_pod\"}[5m])",
              "legendFormat": "{{ pod }}"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 41 },
          "id": 50,
          "panels": [],
          "title": "Other Services — Requested Resources",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "description": "CPU cores (Actual Usage or Requests) by non-Ray pods.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "short",
              "min": 0
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 42 },
          "id": 51,
          "title": "CPU $metric_type — Other Pods",
          "type": "bargauge",
          "options": { "orientation": "horizontal", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [
            {
              "expr": "${metric_type:csv} == \"Usage\" ? sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\", pod!~\".*(?:head|worker|submitter).*\"}[2m])) : sum by (pod) (kube_pod_container_resource_requests{namespace=~\"$namespace\", pod!~\".*(?:head|worker|submitter).*\", resource=\"cpu\"})",
              "legendFormat": "{{ pod }}"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "description": "Memory (Actual Usage or Requests) by non-Ray pods.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "bytes",
              "min": 0
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 42 },
          "id": 52,
          "title": "Memory $metric_type — Other Pods",
          "type": "bargauge",
          "options": { "orientation": "horizontal", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [
            {
              "expr": "${metric_type:csv} == \"Usage\" ? sum by (pod) (container_memory_working_set_bytes{namespace=~\"$namespace\", pod!~\".*(?:head|worker|submitter).*\"}) : sum by (pod) (kube_pod_container_resource_requests{namespace=~\"$namespace\", pod!~\".*(?:head|worker|submitter).*\", resource=\"memory\"})",
              "legendFormat": "{{ pod }}"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 50 },
          "id": 30,
          "panels": [],
          "title": "Ray Object Store (requires Ray metrics exporter on head :8080)",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" },
              "unit": "bytes"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 51 },
          "id": 31,
          "title": "Ray Object Store Memory",
          "description": "Requires Ray's built-in Prometheus exporter enabled on the head node (ray_object_store_memory metric).",
          "type": "timeseries",
          "targets": [
            {
              "expr": "ray_object_store_memory{namespace=~\"$namespace\"}",
              "legendFormat": "{{ pod }}"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" },
              "unit": "short"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 51 },
          "id": 32,
          "title": "Ray Spilled Objects",
          "description": "Requires Ray's built-in Prometheus exporter. Shows objects spilled to disk when object store is full.",
          "type": "timeseries",
          "targets": [
            {
              "expr": "ray_object_store_num_spilled_objects{namespace=~\"$namespace\"}",
              "legendFormat": "{{ pod }}"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 59 },
          "id": 40,
          "panels": [],
          "title": "Disk & Network",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" },
              "unit": "percentunit"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 60 },
          "id": 41,
          "title": "Node I/O Wait",
          "type": "timeseries",
          "targets": [
            {
              "expr": "rate(node_cpu_seconds_total{mode=\"iowait\", instance=~\"$node\"}[2m])",
              "legendFormat": "{{ instance }}"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" },
              "unit": "Bps"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 60 },
          "id": 42,
          "title": "Network I/O — Ray Pods",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum by (pod) (rate(container_network_receive_bytes_total{namespace=~\"$namespace\", pod=~\"$ray_pod\"}[2m]))",
              "legendFormat": "{{ pod }} rx"
            },
            {
              "expr": "sum by (pod) (rate(container_network_transmit_bytes_total{namespace=~\"$namespace\", pod=~\"$ray_pod\"}[2m]))",
              "legendFormat": "{{ pod }} tx"
            }
          ]
        }
      ],
      "schemaVersion": 39,
      "tags": ["mlops", "resources", "ray"],
      "templating": {
        "list": [
          {
            "current": { "selected": false, "text": "Prometheus", "value": "Prometheus" },
            "hide": 0,
            "includeAll": false,
            "name": "DS_PROMETHEUS",
            "query": "prometheus",
            "type": "datasource"
          },
          {
            "current": {},
            "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
            "definition": "label_values(kube_pod_info, namespace)",
            "hide": 0,
            "includeAll": true,
            "multi": true,
            "name": "namespace",
            "query": "label_values(kube_pod_info, namespace)",
            "refresh": 2,
            "regex": "^(ray|spark|serving|apps)$",
            "sort": 1,
            "type": "query"
          },
          {
            "current": {},
            "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
            "definition": "label_values(kube_pod_info{namespace=~\"$namespace\"}, pod)",
            "hide": 0,
            "includeAll": true,
            "multi": true,
            "name": "ray_pod",
            "label": "Ray Pod",
            "query": "label_values(kube_pod_info{namespace=~\"$namespace\"}, pod)",
            "refresh": 2,
            "regex": ".*(?:head|worker|submitter).*",
            "sort": 1,
            "type": "query"
          },
          {
            "current": {},
            "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
            "definition": "label_values(kube_pod_info{namespace=~\"$namespace\"}, node)",
            "hide": 0,
            "includeAll": true,
            "multi": true,
            "name": "node",
            "query": "label_values(kube_pod_info{namespace=~\"$namespace\"}, node)",
            "refresh": 2,
            "sort": 1,
            "type": "query"
          },
          {
            "current": { "selected": true, "text": "Usage", "value": "Usage" },
            "description": "Toggle between Actual Usage and Requested Resources for non-Ray services.",
            "hide": 0,
            "includeAll": false,
            "label": "Metric Type",
            "multi": false,
            "name": "metric_type",
            "options": [
              { "selected": true, "text": "Usage", "value": "Usage" },
              { "selected": false, "text": "Requested", "value": "Requested" }
            ],
            "query": "Usage,Requested",
            "skipUrl": false,
            "type": "custom"
          }
        ]
      },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "MLOps Worker Resources",
      "uid": "mlops-worker-resources",
      "version": 2
    }

        {
