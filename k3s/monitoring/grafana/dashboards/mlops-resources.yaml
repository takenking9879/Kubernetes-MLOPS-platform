apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-mlops-resources
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  mlops-resources.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "grafana", "uid": "-- Grafana --" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "panels": [],
          "title": "Cluster Overview",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 90 }
                ]
              },
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          },
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 1 },
          "id": 2,
          "title": "Cluster GPU Utilization %",
          "type": "gauge",
          "targets": [
            {
              "expr": "avg(skypilot_gpu_utilization_pct{cluster=~\"$sky_cluster\"}) or vector(0)",
              "legendFormat": "GPU %"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 90 }
                ]
              },
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          },
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 1 },
          "id": 3,
          "title": "Cluster CPU Utilization %",
          "type": "gauge",
          "targets": [
            {
              "expr": "100 * (1 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])))",
              "legendFormat": "CPU %"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 90 }
                ]
              },
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          },
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 1 },
          "id": 4,
          "title": "Cluster Memory Utilization %",
          "type": "gauge",
          "targets": [
            {
              "expr": "100 * (1 - (sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes)))",
              "legendFormat": "Memory %"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 7 },
          "id": 10,
          "panels": [],
          "title": "SkyPilot GPU Workers",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" },
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "id": 11,
          "title": "GPU Utilization % by Device",
          "type": "timeseries",
          "targets": [
            {
              "expr": "skypilot_gpu_utilization_pct{cluster=~\"$sky_cluster\"}",
              "legendFormat": "{{ cluster }} gpu{{ gpu }} (spot={{ is_spot }})"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 90 }
                ]
              },
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "id": 12,
          "title": "GPU Memory Utilization %",
          "type": "bargauge",
          "options": { "orientation": "horizontal" },
          "targets": [
            {
              "expr": "(100 * skypilot_gpu_memory_used_mb{cluster=~\"$sky_cluster\"} / skypilot_gpu_memory_total_mb{cluster=~\"$sky_cluster\"}) or vector(0)",
              "legendFormat": "{{ cluster }} gpu{{ gpu }}"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" },
              "unit": "decmbytes"
            }
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "id": 13,
          "title": "GPU Memory Used vs Total (MB)",
          "type": "timeseries",
          "targets": [
            {
              "expr": "skypilot_gpu_memory_used_mb{cluster=~\"$sky_cluster\"}",
              "legendFormat": "{{ cluster }} gpu{{ gpu }} used"
            },
            {
              "expr": "skypilot_gpu_memory_total_mb{cluster=~\"$sky_cluster\"}",
              "legendFormat": "{{ cluster }} gpu{{ gpu }} total"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 24 },
          "id": 50,
          "panels": [],
          "title": "SkyPilot GPU Fleet",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "description": "Average GPU utilization split by spot/on-demand workers.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "percent",
              "min": 0
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 25 },
          "id": 51,
          "title": "Spot vs On-Demand GPU Utilization %",
          "type": "bargauge",
          "options": { "orientation": "horizontal", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [
            {
              "expr": "avg(skypilot_gpu_utilization_pct{cluster=~\"$sky_cluster\", is_spot=\"true\"})",
              "legendFormat": "spot"
            },
            {
              "expr": "avg(skypilot_gpu_utilization_pct{cluster=~\"$sky_cluster\", is_spot=\"false\"})",
              "legendFormat": "on-demand"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "description": "Total GPU memory in use by SkyPilot cluster.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "decmbytes",
              "min": 0
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 25 },
          "id": 52,
          "title": "GPU Memory Used by Cluster (MB)",
          "type": "bargauge",
          "options": { "orientation": "horizontal", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [
            {
              "expr": "sum by (cluster) (skypilot_gpu_memory_used_mb{cluster=~\"$sky_cluster\"})",
              "legendFormat": "{{ cluster }}"
            }
          ]
        }
      ],
      "schemaVersion": 39,
      "tags": ["mlops", "resources", "skypilot", "gpu"],
      "templating": {
        "list": [
          {
            "current": { "selected": false, "text": "Prometheus", "value": "Prometheus" },
            "hide": 0,
            "includeAll": false,
            "name": "DS_PROMETHEUS",
            "query": "prometheus",
            "type": "datasource"
          },
          {
            "allValue": ".*",
            "current": {
              "selected": false,
              "text": "All",
              "value": "$__all"
            },
            "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
            "definition": "label_values(skypilot_gpu_utilization_pct, cluster)",
            "hide": 0,
            "includeAll": true,
            "multi": true,
            "name": "sky_cluster",
            "label": "SkyPilot Cluster",
            "query": "label_values(skypilot_gpu_utilization_pct, cluster)",
            "refresh": 2,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "MLOps Worker Resources",
      "uid": "mlops-worker-resources",
      "version": 4
    }
