# ============================================================
# PROMETHEUS - Lightweight Deployment for ML Platform
# ============================================================
apiVersion: v1
kind: PersistentVolume
metadata:
  name: prometheus-pv-host
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: hostpath
  hostPath:
    # NOTE: /mnt/data is a tiny disk on Docker Desktop (often ~135MB) and will
    # cause Prometheus TSDB to crash with "no space left on device".
    # Use a path on the node root filesystem instead.
    path: /var/lib/prometheus
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc-host
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: hostpath
  volumeName: prometheus-pv-host
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # ===== SPARK DRIVER CUSTOM METRICS (Inference) =====
      - job_name: 'spark-driver-custom'
        static_configs:
          - targets: ['spark-kafka-app-driver-svc.spark.svc.cluster.local:8000']
        metrics_path: /metrics
        scrape_interval: 10s

      # ===== SPARK NATIVE METRICS (Prometheus Servlet - Inference) =====
      - job_name: 'spark-driver-native'
        static_configs:
          - targets: ['spark-kafka-app-driver-svc.spark.svc.cluster.local:4040']
        metrics_path: /metrics/prometheus
        scrape_interval: 15s

      # ===== SPARK PREPROCESSING CUSTOM METRICS (Training) =====
      - job_name: 'spark-preprocess-custom'
        static_configs:
          - targets: ['spark-preprocess-driver-svc.spark.svc.cluster.local:8001']
        metrics_path: /metrics
        scrape_interval: 10s

      # ===== SPARK PREPROCESSING NATIVE METRICS (Training) =====
      - job_name: 'spark-preprocess-native'
        static_configs:
          - targets: ['spark-preprocess-driver-svc.spark.svc.cluster.local:4040']
        metrics_path: /metrics/prometheus
        scrape_interval: 15s

      # ===== RAY TRAINING METRICS (KubeRay Job) =====
      - job_name: 'ray-training'
        static_configs:
          - targets: ['kuberay-training-head-svc.ray.svc.cluster.local:8002']
        metrics_path: /metrics
        scrape_interval: 2s
        scrape_timeout: 1s

      # ===== RAY SERVE METRICS =====
      - job_name: 'ray-serve'
        static_configs:
          - targets: ['model-serving-head-svc.ray.svc.cluster.local:8080']
        metrics_path: /metrics
        scrape_interval: 10s

      # ===== KAFKA BROKERS (Strimzi JMX Exporter) =====
      - job_name: 'kafka-brokers'
        static_configs:
          - targets: ['my-kafka-cluster-kafka-brokers.kafka.svc.cluster.local:9404']
        scrape_interval: 15s

      # ===== KAFKA EXPORTER (Consumer group lag, etc.) =====
      - job_name: 'kafka-exporter'
        static_configs:
          - targets: ['my-kafka-cluster-kafka-exporter.kafka.svc.cluster.local:9404']
        metrics_path: /metrics
        scrape_interval: 15s

      # ===== KUBE-STATE-METRICS =====
      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics.monitoring.svc.cluster.local:8080']
        scrape_interval: 30s

      # ===== NODE EXPORTER (for CPU/RAM cluster metrics) =====
      - job_name: 'node-exporter'
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__address__]
            regex: '(.*):10250'
            replacement: '${1}:9100'
            target_label: __address__

      # ===== KUBELET CADVISOR (container metrics) =====
      - job_name: 'kubelet-cadvisor'
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - nodes/metrics
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ['sh', '-c', 'chown -R 65534:65534 /prometheus']
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: prometheus-storage
              mountPath: /prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.time=7d'
            - '--web.enable-lifecycle'
            - '--web.console.libraries=/usr/share/prometheus/console_libraries'
            - '--web.console.templates=/usr/share/prometheus/consoles'
          ports:
            - containerPort: 9090
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
            - name: prometheus-storage
              mountPath: /prometheus
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: prometheus-storage
          persistentVolumeClaim:
            claimName: prometheus-pvc-host
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
      name: http
  selector:
    app: prometheus
