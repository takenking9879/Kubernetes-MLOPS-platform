# k3s/sky/ray-gpu-training-k8s.yaml
#
# Single-node GPU training on the LOCAL K3S cluster via SkyPilot Kubernetes provider.
# SkyPilot schedules a pod on the K3S node — no SSH, no VM provisioning.
#
# Prerequisites:
#   - Node must have skypilot.co/accelerator label (lowercase, set by up-k3s-gpu.sh / deploy.sh)
#   - Node must expose nvidia.com/gpu in allocatable capacity
#   - sky check (inside API server pod) must show k8s/in-cluster as enabled
#   - Image takenking9879/ray-train:2.53.0 must be imported into k3s containerd
#
# Triggering via Airflow:
#   Trigger training_pipeline_skypilot with:
#     { "providers": ["localGPU"], "train_run_id": "...", ... }
#   The backend (resource_constraints.py) detects the GPU from node labels and
#   generates: any_of: [{infra: k8s/in-cluster, accelerators: rtx4070:1, use_spot: false}]
#   job_builder.py uses this template and injects infra + accelerators directly.

name: ray-gpu-training-k8s

num_nodes: 1

resources:
  # SkyPilot Kubernetes custom images require the docker: prefix.
  # Keep this pinned so local K3S runs do not fall back to SkyPilot's default GPU image.
  image_id: docker:takenking9879/ray-train:2.53.0
  memory: "12+"
  # infra and accelerators are injected by job_builder.py at build time.
  # These placeholders are never used at runtime — they exist so the YAML
  # is valid for manual sky launch testing.
  infra: k8s/in-cluster
  accelerators: rtx4070:1

envs:
  # ── Per-run parameters (overridden at launch time by training_dag_skypilot.py) ──
  TRAIN_RUN_ID: ""
  PREPROCESS_RUN_ID: ""
  MODEL_TYPE: "pytorch"
  PARAMS_S3_PATH: ""
  PROCESSED_TABLE: ""

  # ── GPU control ──
  USE_GPU: "true"
  USE_SPOT: "false"
  USE_DEEPSPEED: "false"

  # ── Infrastructure ──
  MLFLOW_TRACKING_URI: ""
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_DEFAULT_REGION: "us-east-1"
  AWS_S3_ENDPOINT_URL: ""

  # ── Outbound metrics shipping ──
  GPU_PRICE_PER_HOUR: "0"
  SKY_CLUSTER_NAME: ""
  SKY_PROVIDER: "k3s"
  METRICS_SOURCE: "local_k3s"
  METRICS_REMOTE_WRITE_URL: ""
  METRICS_REMOTE_WRITE_USERNAME: ""
  METRICS_REMOTE_WRITE_PASSWORD: ""
  METRICS_PUSHGATEWAY_URL: ""

  # Legacy aliases (kept for parity with other templates)
  GRAFANA_REMOTE_WRITE_URL: ""
  GRAFANA_INSTANCE_ID: ""
  GRAFANA_API_KEY: ""

  # ── Ray training parameters ──
  NUM_WORKERS: "1"
  CPUS_PER_WORKER: "4"
  NUM_WORKERS_TUNE: "1"
  CPUS_PER_WORKER_TUNE: "4"
  MAX_CONCURRENT_TRIALS: "1"
  TUNE_MAX_TRAIN_ROWS: "250000"
  TUNE_MAX_VAL_ROWS: "150000"
  PROMETHEUS_GRACE_SECONDS: "10"
  REPORT_FREQUENCY: "4"

  # ── Ray internals ──
  RAY_enable_infeasible_task_early_exit: "true"
  RAY_DEFAULT_OBJECT_STORE_MEMORY_PROPORTION: "0.7"
  RAY_ACCEL_ENV_VAR_OVERRIDE_ON_ZERO: "0"

setup: |
  set -euo pipefail
  export HOME="${HOME:-/home/ray}"
  export PATH="${HOME}/.local/bin:${PATH}"

  echo "=== ENV DEBUG ==="
  whoami
  which python || true
  python --version || true
  which pip || true
  pip --version || true
  echo "${PATH}"
  echo "${HOME}"

  echo "=== PYTHON CHECK ==="
  python -c "import sys; print(sys.executable)" || true

  echo "=== GPU CHECK ==="
  nvidia-smi || { echo "ERROR: nvidia-smi failed — pod not scheduled on GPU node or runtimeClassName not set"; exit 1; }

  APP_ROOT="${HOME}/app"
  mkdir -p "${APP_ROOT}" "${HOME}/.cache/ray" /tmp/ray

  REPO_DIR=""
  for candidate_repo in "${PWD}" "${HOME}/sky_workdir" "${APP_ROOT}/repo"; do
    if [ -f "${candidate_repo}/k3s/kuberay/main.py" ]; then
      REPO_DIR="${candidate_repo}"
      break
    fi
  done

  if [ -z "${REPO_DIR}" ]; then
    if ! command -v git >/dev/null 2>&1; then
      echo "ERROR: git not found and repo was not synced into the pod."
      exit 1
    fi
    if [ ! -d "${APP_ROOT}/repo/.git" ]; then
      git clone --depth=1 --branch main \
        https://github.com/takenking9879/Kubernetes-MLOPS-platform.git \
        "${APP_ROOT}/repo"
    else
      git -C "${APP_ROOT}/repo" pull --ff-only origin main || true
    fi
    REPO_DIR="${APP_ROOT}/repo"
  fi

  REQ_FILE="${REPO_DIR}/k3s/kuberay/gpu/requirements_tabular_runtime.txt"
  [ -f "${REQ_FILE}" ] || { echo "ERROR: requirements file not found: ${REQ_FILE}"; exit 1; }

  PYTHON_BIN=""
  PYTHON_VERSION=""
  for candidate in python python3 /home/ray/anaconda3/bin/python /home/ray/miniconda3/bin/python \
                   /usr/local/bin/python3.11 /usr/bin/python3.11; do
    if [ -x "${candidate}" ]; then
      CAND_PATH="${candidate}"
    elif command -v "${candidate}" >/dev/null 2>&1; then
      CAND_PATH="$(command -v "${candidate}")"
    else
      continue
    fi

    if CAND_VER="$("${CAND_PATH}" -c \
      "import sys, torch; assert torch.cuda.is_available(); print('.'.join(map(str, sys.version_info[:3])))" 2>/dev/null)"; then
      echo "[setup] Accepted: ${CAND_PATH} (python=${CAND_VER}, torch+cuda OK)"
      PYTHON_BIN="${CAND_PATH}"
      PYTHON_VERSION="${CAND_VER}"
      break
    fi
  done

  [ -n "${PYTHON_BIN}" ] || {
    echo "ERROR: No image Python with torch+CUDA found in takenking9879/ray-train:2.53.0."
    exit 1
  }

  echo "${PYTHON_BIN}" > "${APP_ROOT}/runtime_python.txt"
  echo "${REPO_DIR}" > "${APP_ROOT}/repo_dir.txt"
  echo "[setup] Selected image Python: ${PYTHON_BIN} (version=${PYTHON_VERSION})"

  if ! "${PYTHON_BIN}" - <<'PY'
  import boto3, mlflow, numpy, pandas, prometheus_client, pyarrow, pyiceberg
  import ray, sklearn, torch, xgboost, yaml

  print('[setup] Import smoke test passed.')
  print(f'[setup] runtime torch={torch.__version__} cuda={torch.version.cuda}')
  if not torch.cuda.is_available():
      raise SystemExit('ERROR: runtime torch.cuda.is_available() is False')
  print(f'[setup] GPU visible: {torch.cuda.get_device_name(0)}')
  PY
  then
    "${PYTHON_BIN}" -m pip install --user --no-cache-dir -r "${REQ_FILE}"
    "${PYTHON_BIN}" - <<'PY'
  import boto3, mlflow, numpy, pandas, prometheus_client, pyarrow, pyiceberg
  import ray, sklearn, torch, xgboost, yaml

  print('[setup] Import smoke test passed after user-site install.')
  print(f'[setup] runtime torch={torch.__version__} cuda={torch.version.cuda}')
  if not torch.cuda.is_available():
      raise SystemExit('ERROR: runtime torch.cuda.is_available() is False')
  print(f'[setup] GPU visible: {torch.cuda.get_device_name(0)}')
  PY
  fi

  echo "Setup complete (K3S local GPU pod)."

run: |
  set -euo pipefail
  export HOME="${HOME:-/home/ray}"
  export PATH="${HOME}/.local/bin:${PATH}"

  APP_ROOT="${HOME}/app"
  PYTHON_BIN="$(cat "${APP_ROOT}/runtime_python.txt")"
  REPO_DIR="$(cat "${APP_ROOT}/repo_dir.txt")"
  [ -x "${PYTHON_BIN}" ] || { echo "ERROR: runtime python not executable: ${PYTHON_BIN}"; exit 1; }
  "${PYTHON_BIN}" - <<'PY'
  import sys
  import torch

  print(f"[run] runtime python={sys.version.split()[0]} exe={sys.executable}")
  print(f"[run] runtime torch={torch.__version__} cuda_runtime={torch.version.cuda}")
  print(f"[run] runtime cuda_available={torch.cuda.is_available()}")
  PY

  RAY_BIN="$(dirname "${PYTHON_BIN}")/ray"
  if [ ! -x "${RAY_BIN}" ]; then
    if command -v ray >/dev/null 2>&1; then
      RAY_BIN="$(command -v ray)"
    else
      echo "ERROR: Ray CLI not found for runtime python (${PYTHON_BIN})"
      exit 1
    fi
  fi

  export PYTHONPATH="${REPO_DIR}:${REPO_DIR}/src${PYTHONPATH:+:${PYTHONPATH}}"

  LOG_DIR="/tmp/skypilot-logs"
  mkdir -p "${LOG_DIR}"
  GPU_EXPORTER_LOG="${LOG_DIR}/gpu_exporter.log"

  GPU_EXPORTER_PID=""
  _terminate_pid() {
    local pid="${1:-}"
    local label="${2:-process}"
    if [ -z "${pid}" ] || ! kill -0 "${pid}" 2>/dev/null; then
      return 0
    fi
    kill "${pid}" 2>/dev/null || true
    for _ in $(seq 1 10); do
      if ! kill -0 "${pid}" 2>/dev/null; then break; fi
      sleep 1
    done
    if kill -0 "${pid}" 2>/dev/null; then
      kill -9 "${pid}" 2>/dev/null || true
    fi
    wait "${pid}" 2>/dev/null || true
  }

  cleanup_background() {
    set +e
    _terminate_pid "${GPU_EXPORTER_PID}" "gpu-exporter"
    echo "[run] Stopping training Ray cluster (port 6379)..."
    pkill -SIGTERM -f "ray.*[=:]6379" 2>/dev/null || true
    sleep 5
    pkill -SIGKILL -f "ray.*[=:]6379" 2>/dev/null || true
    echo "[run] Training Ray cluster stopped."
  }
  trap cleanup_background EXIT INT TERM

  "${PYTHON_BIN}" "${REPO_DIR}/k3s/sky/gpu_exporter.py" \
    >"${GPU_EXPORTER_LOG}" 2>&1 &
  GPU_EXPORTER_PID=$!
  echo "[run] GPU exporter started (PID=${GPU_EXPORTER_PID})"

  export RAY_ADDRESS="127.0.0.1:6379"
  _detect_pod_cpus() {
    local pod_cpus="${SKYPILOT_POD_CPU_CORE_LIMIT:-${K8S_CPU_LIMIT:-}}"
    if [ -n "${pod_cpus}" ] && [ "${pod_cpus}" -gt 0 ] 2>/dev/null; then
      echo "${pod_cpus}"
      return
    fi
    nproc 2>/dev/null || echo 1
  }
  TOTAL_CPUS_NODE=$(_detect_pod_cpus)
  echo "[run] Using CPU budget=${TOTAL_CPUS_NODE} (SKYPILOT_POD_CPU_CORE_LIMIT=${SKYPILOT_POD_CPU_CORE_LIMIT:-unset})"

  if [ "${SKYPILOT_NUM_GPUS_PER_NODE:-0}" -gt 0 ]; then
    "${RAY_BIN}" start --head \
      --port=6379 \
      --dashboard-port=8265 \
      --dashboard-host=0.0.0.0 \
      --disable-usage-stats \
      --include-dashboard=True \
      --num-cpus="${TOTAL_CPUS_NODE}" \
      --num-gpus="${SKYPILOT_NUM_GPUS_PER_NODE}"
  else
    "${RAY_BIN}" start --head \
      --port=6379 \
      --dashboard-port=8265 \
      --dashboard-host=0.0.0.0 \
      --disable-usage-stats \
      --include-dashboard=True \
      --num-cpus="${TOTAL_CPUS_NODE}"
  fi

  for i in $(seq 1 60); do
    "${RAY_BIN}" health-check --address=127.0.0.1:6379 &>/dev/null && break
    echo "Waiting for Ray head ($i/60)"
    sleep 1
  done
  "${RAY_BIN}" health-check --address=127.0.0.1:6379 \
    || { echo "ERROR: Ray head did not become healthy"; exit 1; }

  sleep 5

  GPUS=${SKYPILOT_NUM_GPUS_PER_NODE:-1}
  export NUM_WORKERS=${NUM_WORKERS:-${GPUS}}
  export NUM_WORKERS_TUNE=${NUM_WORKERS_TUNE:-1}
  export MAX_CONCURRENT_TRIALS=${MAX_CONCURRENT_TRIALS:-${NUM_WORKERS}}
  export GPUS_PER_WORKER=${GPUS_PER_WORKER:-1}
  export GPUS_PER_WORKER_TUNE=${GPUS_PER_WORKER_TUNE:-${GPUS_PER_WORKER}}
  _cpus_per_worker_uniform_with_leftover() {
    local total_cpus="${1:-1}" workers="${2:-1}"
    if [ "${workers}" -le 0 ]; then workers=1; fi
    local base=$(( total_cpus / workers ))
    local rem=$(( total_cpus % workers ))
    local out="${base}"
    if [ "${rem}" -eq 0 ]; then out=$(( base - 1 )); fi
    if [ "${out}" -lt 1 ]; then out=1; fi
    echo "${out}"
  }

  export CPUS_PER_WORKER=$(_cpus_per_worker_uniform_with_leftover "${TOTAL_CPUS_NODE}" "${NUM_WORKERS}")
  export CPUS_PER_WORKER_TUNE=${CPUS_PER_WORKER}

  echo "[run] Ray params: NUM_WORKERS=${NUM_WORKERS} GPUS_PER_WORKER=${GPUS_PER_WORKER} CPUS_PER_WORKER=${CPUS_PER_WORKER} (node_cpus=${TOTAL_CPUS_NODE} SKYPILOT_NUM_GPUS_PER_NODE=${SKYPILOT_NUM_GPUS_PER_NODE:-unset})"

  "${PYTHON_BIN}" "${REPO_DIR}/k3s/kuberay/main.py"

  echo "=============================="
  echo "===== MAIN.PY TERMINATED ====="
  date
  echo "=============================="
