name: ray-gpu-smoke-local
num_nodes: 1

resources:
  infra: ssh/local-gpu
  image_id: docker:takenking9879/ray-train-ssh:2.53.0

run: |
  set -euo pipefail
  echo "SMOKE_START"
  nvidia-smi
  echo "GPU_OK"
  # Ray CPU tasks can set CUDA_VISIBLE_DEVICES="".
  # For this local SSH flow we intentionally validate direct GPU access.
  unset CUDA_VISIBLE_DEVICES
  python3 - <<'PY'
  import torch

  assert torch.cuda.is_available(), 'CUDA not available'
  print('TORCH_CUDA_OK:', torch.cuda.get_device_name(0))

  # Mini workload to prove we really execute on GPU.
  x = torch.randn((256, 256), device='cuda')
  y = torch.randn((256, 256), device='cuda')
  z = x @ y
  print('TORCH_GPU_MATMUL_OK:', float(z.mean().item()))
  PY
  echo "SMOKE_PASS"
