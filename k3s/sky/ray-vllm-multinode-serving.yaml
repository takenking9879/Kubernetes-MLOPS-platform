# k3s/sky/ray-vllm-multinode-serving.yaml
#
# Multi-node vLLM serving using the Kimi-K2 pattern:
#   Head node: ray start --head + vllm serve with tensor+pipeline parallelism
#   Worker nodes: join Ray cluster, sleep (Ray routes work automatically)
#
# Use this for models that don't fit on a single node
# (e.g. Llama-3.1-70B, DeepSeek-R1-70B, Qwen2.5-72B).
#
# For single-node models, use vllm-serving.yaml instead (simpler, cheaper).
#
# On-demand only — serving clusters need uptime (no spot preemption tolerance).
#
# Triggered by ray_vllm_serving_pipeline Airflow DAG via sky.launch().
#
# Test with an ungated model:
#   sky launch k3s/sky/ray-vllm-multinode-serving.yaml \
#     --env HF_MODEL_ID=Qwen/Qwen2.5-7B \
#     --env TENSOR_PARALLEL_SIZE=1 \
#     --env PIPELINE_PARALLEL_SIZE=2 \
#     --yes

name: ray-vllm-multinode-serving

num_nodes: 2   # overridden by JobBuilder from serving config

resources:
  # Custom image — all deps baked in (torch 2.10.0 cu128, ray 2.53.0, vllm 0.18.0).
  image_id: docker:takenking9879/ray-llm:2.53.0
  ordered:
    # Prefer NVLink-capable nodes for multi-GPU tensor parallelism
    - cloud: runpod
      accelerators: A100:8
      use_spot: false
    - cloud: runpod
      accelerators: A100-80GB:8
      use_spot: false
    # AWS EFA-capable (best for multi-node pipeline parallelism)
    - cloud: aws
      instance_type: p4d.24xlarge
      use_spot: false
    - cloud: aws
      instance_type: p3dn.24xlarge
      use_spot: false
    # Smaller fallback (dev/test)
    - cloud: runpod
      accelerators: A100:4
      use_spot: false
    - cloud: vast
      accelerators: A100-80GB:4
      use_spot: false
  disk_size: 200
  network_tier: best   # prefer EFA/InfiniBand when available

# Safety net: auto-terminate if idle for 60 min.
idle_minutes_to_autostop: 60

envs:
  # ── Model ──
  HF_MODEL_ID: "meta-llama/Llama-3.1-8B"
  HF_TOKEN: ""
  LLM_ADAPTER_S3: ""        # optional LoRA adapter at s3://bucket/path/adapter/

  # ── vLLM parallelism ──
  TENSOR_PARALLEL_SIZE: "8"          # GPUs per node
  PIPELINE_PARALLEL_SIZE: "2"        # number of nodes
  MAX_MODEL_LEN: "32768"
  VLLM_PORT: "8081"
  GPU_MEMORY_UTILIZATION: "0.90"

  # ── Infrastructure ──
  AWS_ACCESS_KEY_ID: ""
  AWS_DEFAULT_REGION: "us-east-1"
  AWS_SECRET_ACCESS_KEY: ""

setup: |
  set -euo pipefail

  nvidia-smi || { echo "ERROR: nvidia-smi failed — GPU not attached"; exit 1; }

  # All Python deps are baked into the image (ray-llm:2.53.0 — vllm 0.18.0, ray 2.53.0).
  # No pip install needed.

  # Optional LoRA adapter download
  if [ -n "${LLM_ADAPTER_S3:-}" ]; then
    aws s3 sync "${LLM_ADAPTER_S3}" /tmp/lora_adapter/ --quiet || true
  fi

  echo "Setup complete — Ray+vLLM multi-node ready (image pre-baked)."

run: |
  set -e

  HEAD_IP=$(echo "$SKYPILOT_NODE_IPS" | head -1)
  NODE_RANK="${SKYPILOT_NODE_RANK:-0}"

  # Each node needs to know its own IP for NCCL
  export VLLM_HOST_IP=$(echo "$SKYPILOT_NODE_IPS" | awk "NR==$((NODE_RANK+1))")

  if [ "$NODE_RANK" == "0" ]; then
    # ── Head node: start Ray + vLLM serve ───────────────────────────────────
    ray start --head --port=6379 --disable-usage-stats --block &
    RAY_PID=$!

    # Wait for all workers to join
    echo "[head] Waiting for ${SKYPILOT_NUM_NODES} nodes to join Ray cluster..."
    python3 - <<'WAIT_EOF'
  import ray, time, os, sys
  ray.init(address="auto", ignore_reinit_error=True)
  num_nodes = int(os.getenv("SKYPILOT_NUM_NODES", "2"))
  gpus_per_node = int(os.getenv("TENSOR_PARALLEL_SIZE", "1"))
  expected_gpus = (num_nodes - 1) * gpus_per_node
  for attempt in range(60):
      available = ray.cluster_resources().get("GPU", 0)
      if available >= expected_gpus:
          print(f"[head] {int(available)} worker GPUs registered. Starting vLLM.")
          sys.exit(0)
      time.sleep(10)
  print(f"[head] Timeout waiting for {expected_gpus} GPUs. Starting anyway.")
  sys.exit(0)
  WAIT_EOF

    # ── vLLM serve ───────────────────────────────────────────────────────────
    LORA_ARGS=""
    if [ -d /tmp/lora_adapter ] && [ -n "$(ls /tmp/lora_adapter 2>/dev/null)" ]; then
      LORA_ARGS="--lora-modules local=/tmp/lora_adapter/"
    fi

    vllm serve "${HF_MODEL_ID}" \
      --host 0.0.0.0 \
      --port "${VLLM_PORT}" \
      --tensor-parallel-size "${TENSOR_PARALLEL_SIZE}" \
      --pipeline-parallel-size "${PIPELINE_PARALLEL_SIZE}" \
      --max-model-len "${MAX_MODEL_LEN}" \
      --gpu-memory-utilization "${GPU_MEMORY_UTILIZATION}" \
      ${LORA_ARGS}

  else
    # ── Worker nodes: join Ray cluster, sleep ────────────────────────────────
    sleep 15
    ray start \
      --address="${HEAD_IP}:6379" \
      --num-gpus="${TENSOR_PARALLEL_SIZE}" \
      --node-ip-address="${VLLM_HOST_IP}" \
      --disable-usage-stats \
      --block
  fi
