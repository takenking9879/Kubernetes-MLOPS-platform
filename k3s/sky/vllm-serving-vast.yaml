# k3s/sky/vllm-serving-vast.yaml
#
# Persistent vLLM serving cluster on Vast.ai via SkyPilot sky.launch() (NOT managed jobs).
# Provider template: vastai/pytorch (torch pre-installed — NOT reinstalled at runtime).
# vLLM 0.18.0 installed at runtime (lightweight — torch excluded).
#
# On-demand only — serving needs uptime, spot preemptions are unacceptable.
#
# Usage (manual test):
#   sky launch k3s/sky/vllm-serving-vast.yaml \
#     --cluster-name vllm-vast \
#     --env HF_MODEL_ID=Qwen/Qwen2.5-7B \
#     --yes
#
# Tear down:
#   sky down vllm-vast
#
# Triggered by vllm_serving_dag.py when provider=vast.

name: vllm-serving-vast

num_nodes: 1

resources:
  # Vast.ai PyTorch template — torch 2.10.0 (cu13.0) pre-installed.
  # DO NOT reinstall torch/CUDA at runtime.
  image_id: vastai/pytorch:2.10.0-cu130-cuda-13.1-mini-py311-2026-03-19
  ordered:
    - cloud: vast
      accelerators: A100:1
      use_spot: false
    - cloud: vast
      accelerators: RTX4090:1
      use_spot: false
    - cloud: vast
      accelerators: A40:1
      use_spot: false
  disk_size: 100

# Safety net: auto-terminate if idle for 60 min
idle_minutes_to_autostop: 60

envs:
  # ── Per-run parameters ──
  SERVE_RUN_ID: ""
  HF_MODEL_ID: "meta-llama/Llama-3.1-8B"
  HF_TOKEN: ""
  LLM_ADAPTER_S3: ""         # optional: s3://bucket/path/to/lora-adapter/

  # ── vLLM config ──
  VLLM_PORT: "8000"
  MAX_MODEL_LEN: "4096"
  GPU_MEMORY_UTILIZATION: "0.90"
  TENSOR_PARALLEL_SIZE: "1"

  # ── Infrastructure ──
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_DEFAULT_REGION: "us-east-1"
  S3_BUCKET: "k8s-mlops-platform-bucket"

setup: |
  set -euo pipefail

  nvidia-smi || { echo "ERROR: nvidia-smi failed — GPU not attached"; exit 1; }

  if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo"; fi

  ${SUDO} mkdir -p /home/ray/app

  for probe in python3.12 /usr/bin/python3.12 /usr/local/bin/python3.12 /root/miniconda3/bin/python python3 python; do
    if [ -x "${probe}" ]; then
      "${probe}" --version || true
    elif command -v "${probe}" >/dev/null 2>&1; then
      "$(command -v "${probe}")" --version || true
    fi
  done

  # Pick ONE interpreter from the provider image and use it for everything:
  # torch check, dependency install, and runtime execution.
  PYTHON_BIN=""
  PYTHON_VERSION=""
  for candidate in python3.12 /usr/bin/python3.12 /usr/local/bin/python3.12 /root/miniconda3/bin/python python3 python; do
    if [ -x "${candidate}" ]; then
      CAND_PATH="${candidate}"
    elif command -v "${candidate}" >/dev/null 2>&1; then
      CAND_PATH="$(command -v "${candidate}")"
    else
      continue
    fi

    if CAND_VER="$("${CAND_PATH}" -c "import sys, torch; assert torch.cuda.is_available(); print('.'.join(map(str, sys.version_info[:3])))" 2>/dev/null)"; then
      PYTHON_BIN="${CAND_PATH}"
      PYTHON_VERSION="${CAND_VER}"
      break
    fi
  done

  [ -n "${PYTHON_BIN}" ] || {
    echo "ERROR: No base-image Python with torch+CUDA found."
    echo "Checked candidates: python3.12 /usr/bin/python3.12 /usr/local/bin/python3.12 /root/miniconda3/bin/python python3 python"
    exit 1
  }

  echo "[setup] Selected runtime base Python: ${PYTHON_BIN} (version=${PYTHON_VERSION})"

  "${PYTHON_BIN}" - <<'PY'
  import sys
  import torch

  print(f"[setup] base torch={torch.__version__} cuda_runtime={torch.version.cuda} python={sys.version.split()[0]}")
  if not torch.cuda.is_available():
      raise SystemExit("ERROR: base torch.cuda.is_available() is False")
  print("[setup] GPU detected successfully")
  print(f"[setup] base torch GPU visible: {torch.cuda.get_device_name(0)}")
  PY

  RUNTIME_VENV="/opt/ml-platform-runtime"
  ${SUDO} rm -rf "${RUNTIME_VENV}"
  ${SUDO} "${PYTHON_BIN}" -m venv --system-site-packages "${RUNTIME_VENV}"

  RUNTIME_PYTHON="${RUNTIME_VENV}/bin/python"
  [ -x "${RUNTIME_PYTHON}" ] || { echo "ERROR: venv python not found: ${RUNTIME_PYTHON}"; exit 1; }

  echo "${RUNTIME_PYTHON}" | ${SUDO} tee /home/ray/app/runtime_python.txt >/dev/null
  echo "[setup] Runtime venv Python: ${RUNTIME_PYTHON}"

  # Install vLLM 0.18.0 + boto3 — torch skipped (pre-installed in provider template)
  ${SUDO} "${RUNTIME_PYTHON}" -m pip install --no-cache-dir vllm==0.18.0 boto3==1.42.28

  # Download LoRA adapter from S3 if provided
  if [ -n "${LLM_ADAPTER_S3:-}" ]; then
    echo "Downloading LoRA adapter from ${LLM_ADAPTER_S3}"
    aws s3 sync "${LLM_ADAPTER_S3}" /tmp/lora_adapter/ \
      --region "${AWS_DEFAULT_REGION}"
    echo "Adapter downloaded to /tmp/lora_adapter/"
  fi

  echo "Setup complete — vLLM 0.18.0 ready."

run: |
  set -euo pipefail

  PYTHON_BIN="$(cat /home/ray/app/runtime_python.txt)"
  [ -x "${PYTHON_BIN}" ] || { echo "ERROR: runtime python not executable: ${PYTHON_BIN}"; exit 1; }

  VLLM_BIN="$(dirname "${PYTHON_BIN}")/vllm"
  [ -x "${VLLM_BIN}" ] || { echo "ERROR: vllm binary not found at ${VLLM_BIN}"; exit 1; }

  LORA_ARG=""
  if [ -d /tmp/lora_adapter ] && [ "$(ls -A /tmp/lora_adapter)" ]; then
    LORA_ARG="--lora-modules adapter=/tmp/lora_adapter"
  fi

  echo "Starting vLLM: model=${HF_MODEL_ID}, port=${VLLM_PORT}"

  "${VLLM_BIN}" serve "${HF_MODEL_ID}" \
    --host 0.0.0.0 \
    --port "${VLLM_PORT}" \
    --gpu-memory-utilization "${GPU_MEMORY_UTILIZATION}" \
    --max-model-len "${MAX_MODEL_LEN}" \
    --tensor-parallel-size "${TENSOR_PARALLEL_SIZE}" \
    ${HF_TOKEN:+--hf-token "${HF_TOKEN}"} \
    ${LORA_ARG}
