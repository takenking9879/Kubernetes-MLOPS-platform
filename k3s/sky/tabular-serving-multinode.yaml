# k3s/sky/tabular-serving-multinode.yaml
#
# SkyPilot sky serve for tabular model — multi-node Ray cluster per replica (Kimi-K2 pattern adapted).
#   Head node (SKYPILOT_NODE_RANK=0): ray start --head + Ray Serve (loads model, serves HTTP)
#   Worker nodes  (SKYPILOT_NODE_RANK>0): join Ray cluster, idle (Ray routes work automatically)
#
# Use when a single node is insufficient (large ensemble models, high-concurrency serving).
# For single-node models use tabular-serving-single.yaml (simpler, cheaper).
#
# CPU-only — no GPU needed for tabular inference.
# On-demand only — spot preemption would cause endpoint downtime.
#
# Usage (manual test):
#   sky serve up k3s/sky/tabular-serving-multinode.yaml \
#     --env SERVE_RUN_ID=test-multi-001 \
#     --env REGISTRY_MODEL_NAME=my_xgb_model \
#     --yes
#
# Tear down:
#   sky serve down tabular-serving-multinode
#
# Triggered by tabular_serving_skypilot_pipeline Airflow DAG when num_nodes > 1.

name: tabular-serving-multinode

num_nodes: 2   # overridden by DAG via job_builder (num_nodes per replica)

service:
  readiness_probe: /health
  replica_policy:
    min_replicas: 1        # overridden by DAG via job_builder
    max_replicas: 2        # each replica is a cluster — keep default low
    target_qps_per_replica: 50

resources:
  ports: 8000
  ordered:
    - cloud: runpod
      cpus: 4+
      memory: 16+
      use_spot: false
    - cloud: vast
      cpus: 4+
      memory: 16+
      use_spot: false
    - cloud: aws
      instance_type: m5.2xlarge
      use_spot: false
    - cloud: aws
      instance_type: m5.xlarge
      use_spot: false

envs:
  SERVE_RUN_ID: ""
  S3_BUCKET: "k8s-mlops-platform-bucket"
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_DEFAULT_REGION: "us-east-1"
  MLFLOW_TRACKING_URI: ""
  SERVE_PORT: "8000"
  REGISTRY_MODEL_NAME: ""
  MODEL_ALIAS: "champion"
  RAY_PORT: "6379"

setup: |
  set -euo pipefail
  pip install --quiet \
    "ray[serve]>=2.40" \
    mlflow>=2.10 \
    xgboost>=1.7 \
    scikit-learn>=1.3 \
    boto3>=1.34 \
    pyyaml \
    starlette \
    uvicorn

run: |
  set -euo pipefail

  NUM_NODES="${SKYPILOT_NUM_NODES:-2}"
  NODE_RANK="${SKYPILOT_NODE_RANK:-0}"
  HEAD_IP="$(echo "${SKYPILOT_NODE_IPS}" | head -1)"
  RAY_PORT="${RAY_PORT:-6379}"
  SERVE_PORT="${SERVE_PORT:-8000}"

  if [ "${NODE_RANK}" = "0" ]; then
    # ── Head node: start Ray, load model, start Ray Serve ──────────────────────
    echo "[head] Starting Ray head on ${HEAD_IP}:${RAY_PORT}"
    ray start --head \
      --port="${RAY_PORT}" \
      --dashboard-host=0.0.0.0 \
      --block &
    RAY_PID=$!

    # Wait for Ray to be ready
    sleep 10

    echo "[head] Ray started — launching serving application"
    python - <<'PY'
  import os, json, time, boto3, yaml, ray
  from ray import serve
  from starlette.requests import Request
  from starlette.responses import JSONResponse
  import mlflow

  S3_BUCKET   = os.environ["S3_BUCKET"]
  SERVE_ID    = os.environ["SERVE_RUN_ID"]
  MLFLOW_URI  = os.environ.get("MLFLOW_TRACKING_URI", "")
  SERVE_PORT  = int(os.environ.get("SERVE_PORT", "8000"))
  REG_MODEL   = os.environ.get("REGISTRY_MODEL_NAME", "")
  ALIAS       = os.environ.get("MODEL_ALIAS", "champion")
  HEAD_IP     = os.environ.get("SKYPILOT_NODE_IPS", "127.0.0.1").split()[0]
  RAY_PORT    = os.environ.get("RAY_PORT", "6379")

  # Fall back to params_serving.yaml on S3 when env vars are not injected
  if not REG_MODEL:
      s3 = boto3.client(
          "s3",
          aws_access_key_id=os.environ.get("AWS_ACCESS_KEY_ID") or None,
          aws_secret_access_key=os.environ.get("AWS_SECRET_ACCESS_KEY") or None,
          region_name=os.environ.get("AWS_DEFAULT_REGION", "us-east-1"),
      )
      obj = s3.get_object(
          Bucket=S3_BUCKET,
          Key=f"runs/serving/{SERVE_ID}/params_serving.yaml",
      )
      params = yaml.safe_load(obj["Body"].read())
      serving = params.get("serving", {})
      REG_MODEL = serving.get("registry_model_name", "")
      ALIAS     = serving.get("alias", ALIAS)

  if not REG_MODEL:
      raise RuntimeError("REGISTRY_MODEL_NAME not set and not found in params_serving.yaml")

  if MLFLOW_URI:
      mlflow.set_tracking_uri(MLFLOW_URI)

  print(f"Loading model: models:/{REG_MODEL}@{ALIAS}")
  model = mlflow.pyfunc.load_model(f"models:/{REG_MODEL}@{ALIAS}")
  print("Model loaded successfully")

  # Connect to the already-running Ray head
  ray.init(address=f"{HEAD_IP}:{RAY_PORT}", ignore_reinit_error=True)
  serve.start(http_options={"host": "0.0.0.0", "port": SERVE_PORT})

  @serve.deployment(num_replicas=1)
  class TabularApp:
      def __init__(self):
          self._model = model

      async def __call__(self, request: Request):
          path = request.url.path
          if path == "/health":
              return JSONResponse({"status": "healthy"})
          try:
              body = await request.json()
          except Exception:
              return JSONResponse({"error": "invalid JSON"}, status_code=400)
          if "data" not in body:
              return JSONResponse(
                  {"error": 'expected {"data": [[f1, f2, ...], ...]}'},
                  status_code=400,
              )
          import numpy as np
          preds = self._model.predict(np.array(body["data"]))
          return JSONResponse({"predictions": preds.tolist()})

  serve.run(TabularApp.bind(), route_prefix="/")
  print(f"Tabular multinode serve running on port {SERVE_PORT}")

  # Block forever so the SkyServe replica stays alive
  while True:
      time.sleep(60)
  PY

    wait $RAY_PID
  else
    # ── Worker nodes: join Ray head and idle ───────────────────────────────────
    echo "[worker rank=${NODE_RANK}] Joining Ray head at ${HEAD_IP}:${RAY_PORT}"
    # Wait briefly for head to start Ray before joining
    sleep 20
    ray start \
      --address="${HEAD_IP}:${RAY_PORT}" \
      --block
  fi
