# k3s/sky/ray-gpu-training-runpod.yaml
#
# Single-node GPU training on RunPod via SkyPilot.
# Provider template: runpod/pytorch (torch pre-installed — NOT reinstalled at runtime).
# Ray + tabular ML libs installed at runtime from requirements_tabular_runtime.txt.
#
# Spot-first ordering. Check current availability: `sky show-gpus --cloud runpod`
#
# Usage (manual test, from repo root):
#   sky launch k3s/sky/ray-gpu-training-runpod.yaml \
#     --name rtx2000-test \
#     --env TRAIN_RUN_ID=train-test-001 \
#     --env MODEL_TYPE=pytorch \
#     --env PARAMS_S3_PATH=s3://bucket/... \
#     --env AWS_ACCESS_KEY_ID=$(aws configure get aws_access_key_id) \
#     --env AWS_SECRET_ACCESS_KEY=$(aws configure get aws_secret_access_key) \
#     --yes
#
# Triggered automatically by training_dag_skypilot.py (sky.jobs.launch) when provider=runpod.

name: ray-gpu-training-runpod

# Single-node: head + GPU worker on the same VM.
num_nodes: 1

resources:
  # RunPod PyTorch template — torch 2.8.0 (cu12.8.1) pre-installed.
  # DO NOT reinstall torch/CUDA at runtime.
  image_id: runpod/pytorch:1.0.2-cu1281-torch280-ubuntu2404
  ordered:
    - infra: runpod/CA/CA-MTL-1
      accelerators: A40:1
      use_spot: true
    - infra: runpod/CA/CA-MTL-1
      accelerators: RTXA5000:1
    - infra: runpod/CA/CA-MTL-1
      accelerators: A40:1
      use_spot: false

  disk_size: 30

envs:
  # ── Per-run parameters (overridden at launch time by training_dag_skypilot.py) ──
  TRAIN_RUN_ID: ""
  PREPROCESS_RUN_ID: ""
  MODEL_TYPE: "pytorch"
  PARAMS_S3_PATH: ""
  PROCESSED_TABLE: ""

  # ── GPU control ──
  USE_GPU: "true"
  USE_SPOT: "true"
  USE_DEEPSPEED: "false"    # set to "true" to enable DeepSpeed ZeRO stage 1

  # ── Infrastructure ──
  MLFLOW_TRACKING_URI: ""         # injected by Airflow DAG via task.update_envs()
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_DEFAULT_REGION: "us-east-1"
  AWS_S3_ENDPOINT_URL: ""

  # ── Outbound metrics shipping (main path) ──
  GPU_PRICE_PER_HOUR: "0"
  SKY_CLUSTER_NAME: ""
  SKY_PROVIDER: "runpod"
  METRICS_SOURCE: "skypilot_vm"
  METRICS_REMOTE_WRITE_URL: ""       # Grafana Agent remote_write (pull path, 15 s interval)
  METRICS_REMOTE_WRITE_USERNAME: ""
  METRICS_REMOTE_WRITE_PASSWORD: ""
  METRICS_PUSHGATEWAY_URL: ""        # Direct push after each trial (<host>:<port>, no path)

  # Legacy aliases (still supported by write_grafana_config.py)
  GRAFANA_REMOTE_WRITE_URL: ""
  GRAFANA_INSTANCE_ID: ""
  GRAFANA_API_KEY: ""

  # ── Ray training parameters ──
  # These are fallback defaults. The Airflow DAG injects the correct values
  # based on num_nodes × num_gpus_per_node before launching. The run script
  # further overrides using SKYPILOT_NUM_GPUS_PER_NODE for direct sky launches.
  NUM_WORKERS: "1"           # DAG injects: single-node workers = GPUs
  CPUS_PER_WORKER: "4"
  NUM_WORKERS_TUNE: "1"      # DAG injects: 1 worker per tuning trial
  CPUS_PER_WORKER_TUNE: "4"
  MAX_CONCURRENT_TRIALS: "1" # DAG injects: same as workers
  TUNE_MAX_TRAIN_ROWS: "250000"
  TUNE_MAX_VAL_ROWS: "150000"
  RAY_MATERIALIZE_DATASETS: "1"
  RAY_MATERIALIZE_DATASETS_TUNE: "1"
  PROMETHEUS_GRACE_SECONDS: "10"
  REPORT_FREQUENCY: "4"

  # ── Ray internals ──
  RAY_enable_infeasible_task_early_exit: "true"
  RAY_DEFAULT_OBJECT_STORE_MEMORY_PROPORTION: "0.7"
  RAY_ACCEL_ENV_VAR_OVERRIDE_ON_ZERO: "0"

setup: |
  set -euo pipefail

  nvidia-smi || { echo "ERROR: nvidia-smi failed - GPU not attached"; exit 1; }

  if [ "$(id -u)" -eq 0 ]; then
    SUDO=""
  else
    SUDO="sudo"
  fi

  if ! id -u ray >/dev/null 2>&1; then
    ${SUDO} useradd -m -s /bin/bash -d /home/ray ray
  fi
  ${SUDO} mkdir -p /home/ray/app /home/ray/.cache/ray /tmp/ray
  ${SUDO} chown -R ray:ray /home/ray /tmp/ray

  if ! command -v git >/dev/null 2>&1; then
    ${SUDO} apt-get update -qq
    ${SUDO} apt-get install -y --no-install-recommends git
    ${SUDO} rm -rf /var/lib/apt/lists/*
  fi

  if [ ! -d /home/ray/app/repo/.git ]; then
    git clone --depth=1 --branch main \
      https://github.com/takenking9879/Kubernetes-MLOPS-platform.git \
      /home/ray/app/repo
  else
    git -C /home/ray/app/repo pull --ff-only origin main
  fi

  REQ_FILE="/home/ray/app/repo/k3s/kuberay/gpu/requirements_tabular_runtime.txt"
  [ -f "${REQ_FILE}" ] || { echo "ERROR: requirements file not found: ${REQ_FILE}"; exit 1; }

  echo "[setup] Probing Python candidates (path + version):"
  for probe in python3.12 /usr/bin/python3.12 /usr/local/bin/python3.12 /root/miniconda3/bin/python python3 python; do
    if [ -x "${probe}" ]; then
      PROBE_PATH="${probe}"
    elif command -v "${probe}" >/dev/null 2>&1; then
      PROBE_PATH="$(command -v "${probe}")"
    else
      echo "[setup] - ${probe}: not found"
      continue
    fi

    PROBE_VER="$("${PROBE_PATH}" -c "import sys; print(sys.version.split()[0])" 2>/dev/null || echo unknown)"
    echo "[setup] - ${probe} -> ${PROBE_PATH} (python=${PROBE_VER})"
  done

  # Pick ONE interpreter from the provider image and use it for everything:
  # torch check, dependency install, and runtime execution.
  PYTHON_BIN=""
  PYTHON_VERSION=""
  for candidate in python3.12 /usr/bin/python3.12 /usr/local/bin/python3.12 /root/miniconda3/bin/python python3 python; do
    if [ -x "${candidate}" ]; then
      CAND_PATH="${candidate}"
    elif command -v "${candidate}" >/dev/null 2>&1; then
      CAND_PATH="$(command -v "${candidate}")"
    else
      continue
    fi

    echo "[setup] Evaluating candidate: ${CAND_PATH}"
    if CAND_VER="$("${CAND_PATH}" -c "import sys, torch; assert torch.cuda.is_available(); print('.'.join(map(str, sys.version_info[:3])))" 2>/dev/null)"; then
      echo "[setup] Candidate accepted: ${CAND_PATH} (python=${CAND_VER}, torch+cuda OK)"
      PYTHON_BIN="${CAND_PATH}"
      PYTHON_VERSION="${CAND_VER}"
      break
    else
      echo "[setup] Candidate rejected: ${CAND_PATH} (missing torch+cuda check)"
    fi
  done

  [ -n "${PYTHON_BIN}" ] || {
    echo "ERROR: No base-image Python with torch+CUDA found."
    echo "Checked candidates: python3.12 /usr/bin/python3.12 /usr/local/bin/python3.12 /root/miniconda3/bin/python python3 python"
    exit 1
  }

  echo "[setup] Selected runtime base Python: ${PYTHON_BIN} (version=${PYTHON_VERSION})"
  "${PYTHON_BIN}" --version
  "${PYTHON_BIN}" - <<'PY'
  import sys
  print(f"[setup] selected sys.executable={sys.executable}")
  PY

  "${PYTHON_BIN}" - <<'PY'
  import sys
  import torch

  print(f"[setup] base torch={torch.__version__} cuda_runtime={torch.version.cuda} python={sys.version.split()[0]}")
  if not torch.cuda.is_available():
      raise SystemExit("ERROR: base torch.cuda.is_available() is False")
  print("[setup] GPU detected successfully")
  print(f"[setup] base torch GPU visible: {torch.cuda.get_device_name(0)}")
  PY

  # Keep requirements compatible with whichever provider Python we selected.
  "${PYTHON_BIN}" - <<'PY'
  from pathlib import Path

  req = Path('/home/ray/app/repo/k3s/kuberay/gpu/requirements_tabular_runtime.txt')
  txt = req.read_text()
  changed = False

  old_numpy = 'numpy==2.3.3\n'
  new_numpy = 'numpy==2.2.6; python_version < "3.11"\n' \
              'numpy==2.3.3; python_version >= "3.11"\n'
  if old_numpy in txt and 'numpy==2.2.6; python_version < "3.11"' not in txt:
      txt = txt.replace(old_numpy, new_numpy, 1)
      changed = True

  old_skl = 'scikit-learn==1.8.0\n'
  new_skl = 'scikit-learn==1.7.2; python_version < "3.11"\n' \
            'scikit-learn==1.8.0; python_version >= "3.11"\n'
  if old_skl in txt and 'scikit-learn==1.7.2; python_version < "3.11"' not in txt:
      txt = txt.replace(old_skl, new_skl, 1)
      changed = True

  if changed:
      req.write_text(txt)
      print(f'[setup] Patched Python-conditional pins in requirements: {req}')
  else:
      print(f'[setup] Requirements already had Python-conditional pins: {req}')
  PY

  RUNTIME_VENV="/opt/ml-platform-runtime"
  ${SUDO} rm -rf "${RUNTIME_VENV}"
  ${SUDO} "${PYTHON_BIN}" -m venv --system-site-packages "${RUNTIME_VENV}"

  RUNTIME_PYTHON="${RUNTIME_VENV}/bin/python"
  [ -x "${RUNTIME_PYTHON}" ] || { echo "ERROR: venv python not found: ${RUNTIME_PYTHON}"; exit 1; }

  echo "${RUNTIME_PYTHON}" | ${SUDO} tee /home/ray/app/runtime_python.txt >/dev/null
  echo "[setup] Runtime venv Python: ${RUNTIME_PYTHON}"
  "${RUNTIME_PYTHON}" - <<'PY'
  import sys
  print(f"[setup] runtime sys.executable={sys.executable} python={sys.version.split()[0]}")
  PY
  ${SUDO} "${RUNTIME_PYTHON}" -m pip --version

  ${SUDO} "${RUNTIME_PYTHON}" -m pip install --no-cache-dir -r "${REQ_FILE}"

  if [ "${USE_DEEPSPEED:-false}" = "true" ]; then
    ${SUDO} "${RUNTIME_PYTHON}" -m pip install --no-cache-dir deepspeed==0.18.8
  else
    echo "Skipping DeepSpeed install (USE_DEEPSPEED=${USE_DEEPSPEED:-false})."
  fi

  "${RUNTIME_PYTHON}" - <<'PY'
  import boto3
  import mlflow
  import numpy
  import pandas
  import prometheus_client
  import pyarrow
  import pyiceberg
  import ray
  import sklearn
  import torch
  import xgboost
  import yaml

  print('Setup import smoke test passed.')
  print(f'[setup] runtime torch={torch.__version__} cuda={torch.version.cuda}')
  if not torch.cuda.is_available():
      raise SystemExit('ERROR: runtime torch.cuda.is_available() is False')
  print('[setup] GPU detected successfully')
  print(f'[setup] runtime GPU visible: {torch.cuda.get_device_name(0)}')
  PY

  echo "Setup complete."

  METRICS_RW_URL="${METRICS_REMOTE_WRITE_URL:-${GRAFANA_REMOTE_WRITE_URL:-}}"
  if [ -n "${METRICS_RW_URL}" ]; then
    AGENT_BIN=/usr/local/bin/grafana-agent
    if [ ! -f "${AGENT_BIN}" ]; then
      AGENT_VER=v0.43.3 ARCH=amd64
      curl -sL "https://github.com/grafana/agent/releases/download/${AGENT_VER}/grafana-agent-linux-${ARCH}.zip" \
        -o /tmp/grafana-agent.zip
      unzip -q /tmp/grafana-agent.zip -d /tmp/
      mv /tmp/grafana-agent-linux-${ARCH} "${AGENT_BIN}"
      chmod +x "${AGENT_BIN}"
    fi
  fi

run: |
  set -euo pipefail

  PYTHON_BIN="$(cat /home/ray/app/runtime_python.txt)"
  [ -x "${PYTHON_BIN}" ] || { echo "ERROR: runtime python not executable: ${PYTHON_BIN}"; exit 1; }
  "${PYTHON_BIN}" - <<'PY'
  import sys
  import torch

  print(f"[run] runtime python={sys.version.split()[0]} exe={sys.executable}")
  print(f"[run] runtime torch={torch.__version__} cuda_runtime={torch.version.cuda}")
  print(f"[run] runtime cuda_available={torch.cuda.is_available()}")
  PY

  RAY_BIN="$(dirname "${PYTHON_BIN}")/ray"
  if [ ! -x "${RAY_BIN}" ]; then
    if command -v ray >/dev/null 2>&1; then
      RAY_BIN="$(command -v ray)"
    else
      echo "ERROR: Ray CLI not found for runtime python (${PYTHON_BIN})"
      exit 1
    fi
  fi

  export PYTHONPATH=/home/ray/app/repo:/home/ray/app/repo/src

  LOG_DIR="/tmp/skypilot-logs"
  mkdir -p "${LOG_DIR}"
  GPU_EXPORTER_LOG="${LOG_DIR}/gpu_exporter.log"
  GRAFANA_AGENT_LOG="${LOG_DIR}/grafana-agent.log"

  GPU_EXPORTER_PID=""
  GRAFANA_AGENT_PID=""
  _terminate_pid() {
    local pid="${1:-}"
    local label="${2:-process}"
    if [ -z "${pid}" ] || ! kill -0 "${pid}" 2>/dev/null; then
      return 0
    fi

    kill "${pid}" 2>/dev/null || true
    for _ in $(seq 1 10); do
      if ! kill -0 "${pid}" 2>/dev/null; then
        break
      fi
      sleep 1
    done

    if kill -0 "${pid}" 2>/dev/null; then
      echo "[run] ${label} still alive after SIGTERM; sending SIGKILL (PID=${pid})"
      kill -9 "${pid}" 2>/dev/null || true
    fi
    wait "${pid}" 2>/dev/null || true
  }

  cleanup_background() {
    # Ensure background telemetry processes never keep the Sky task alive.
    set +e
    _terminate_pid "${GRAFANA_AGENT_PID}" "grafana-agent"
    _terminate_pid "${GPU_EXPORTER_PID}" "gpu-exporter"

    if [ -n "${RAY_BIN:-}" ] && [ -x "${RAY_BIN}" ]; then
      if command -v timeout >/dev/null 2>&1; then
        timeout 30s "${RAY_BIN}" stop --force >/dev/null 2>&1 || true
      else
        "${RAY_BIN}" stop --force >/dev/null 2>&1 || true
      fi
    fi
  }
  trap cleanup_background EXIT INT TERM

  "${PYTHON_BIN}" /home/ray/app/repo/k3s/sky/gpu_exporter.py \
    >"${GPU_EXPORTER_LOG}" 2>&1 &
  GPU_EXPORTER_PID=$!
  echo "[run] GPU exporter started (PID=${GPU_EXPORTER_PID}, log=${GPU_EXPORTER_LOG})"

  METRICS_RW_URL="${METRICS_REMOTE_WRITE_URL:-${GRAFANA_REMOTE_WRITE_URL:-}}"
  if [ -n "${METRICS_RW_URL}" ] && command -v grafana-agent >/dev/null 2>&1; then
    "${PYTHON_BIN}" /home/ray/app/repo/k3s/sky/write_grafana_config.py
    grafana-agent --config.file=/tmp/grafana-agent-config.yaml \
      >"${GRAFANA_AGENT_LOG}" 2>&1 &
    GRAFANA_AGENT_PID=$!
    echo "[run] Grafana Agent started → ${METRICS_RW_URL} (PID=${GRAFANA_AGENT_PID}, log=${GRAFANA_AGENT_LOG})"
  fi

  # Pin all Ray sub-processes (PlacementGroupCleaner, etc.) to the training
  # cluster on 6379 so they don't auto-discover SkyPilot's internal Ray (6380).
  # Export BEFORE `ray start` so worker processes inherit this value.
  export RAY_ADDRESS="127.0.0.1:6379"

  if [ "${SKYPILOT_NUM_GPUS_PER_NODE:-0}" -gt 0 ]; then
    "${RAY_BIN}" start --head \
      --port=6379 \
      --dashboard-port=8265 \
      --dashboard-host=0.0.0.0 \
      --disable-usage-stats \
      --include-dashboard=True \
      --num-gpus="${SKYPILOT_NUM_GPUS_PER_NODE}"
  else
    "${RAY_BIN}" start --head \
      --port=6379 \
      --dashboard-port=8265 \
      --dashboard-host=0.0.0.0 \
      --disable-usage-stats \
      --include-dashboard=True
  fi

  for i in $(seq 1 60); do
    "${RAY_BIN}" health-check --address=127.0.0.1:6379 &>/dev/null && break
    echo "Waiting for Ray head ($i/60)"
    sleep 1
  done
  "${RAY_BIN}" health-check --address=127.0.0.1:6379 \
    || { echo "ERROR: Ray head did not become healthy"; exit 1; }

  sleep 5

  # ── GPU-aware fallback (primary values injected by Airflow DAG via envs) ──
  # If the DAG already set NUM_WORKERS, NUM_WORKERS_TUNE, MAX_CONCURRENT_TRIALS,
  # the ${VAR:-default} syntax keeps those values unchanged.
  # For direct sky launches (bypassing the DAG), derives from SKYPILOT_NUM_GPUS_PER_NODE.
  GPUS=${SKYPILOT_NUM_GPUS_PER_NODE:-1}
  export NUM_WORKERS=${NUM_WORKERS:-${GPUS}}
  export NUM_WORKERS_TUNE=${NUM_WORKERS_TUNE:-1}
  export MAX_CONCURRENT_TRIALS=${MAX_CONCURRENT_TRIALS:-${NUM_WORKERS}}
  export GPUS_PER_WORKER=${GPUS_PER_WORKER:-1}
  export GPUS_PER_WORKER_TUNE=${GPUS_PER_WORKER_TUNE:-${GPUS_PER_WORKER}}

  # CPU detection priority:
  #   1) Ray cluster resources (authoritative for scheduler placement)
  #   2) nproc fallback
  _detect_node_cpus() {
    local ray_cpus
    ray_cpus="$("${PYTHON_BIN}" -c '
  import os
  try:
    import ray
    ray.init(address=os.getenv("RAY_ADDRESS", "127.0.0.1:6379"), ignore_reinit_error=True, log_to_driver=False)
    cpu = int(ray.cluster_resources().get("CPU", 0))
    print(cpu if cpu > 0 else "")
  except Exception:
    print("")
  finally:
    try:
      import ray
      if ray.is_initialized():
        ray.shutdown()
    except Exception:
      pass
  ' 2>/dev/null || true)"
    if [ -n "${ray_cpus}" ] && [ "${ray_cpus}" -gt 0 ] 2>/dev/null; then
      echo "${ray_cpus}"; return
    fi
    nproc 2>/dev/null || echo 1
  }
  TOTAL_CPUS_NODE=$(_detect_node_cpus)
  _cpus_per_worker_uniform_with_leftover() {
    local total_cpus="${1:-1}"
    local workers="${2:-1}"
    if [ "${workers}" -le 0 ]; then
      workers=1
    fi
    local base=$(( total_cpus / workers ))
    local rem=$(( total_cpus % workers ))
    local out="${base}"
    if [ "${rem}" -eq 0 ]; then
      out=$(( base - 1 ))
    fi
    if [ "${out}" -lt 1 ]; then
      out=1
    fi
    echo "${out}"
  }

  export CPUS_PER_WORKER=$(_cpus_per_worker_uniform_with_leftover "${TOTAL_CPUS_NODE}" "${NUM_WORKERS}")
  export CPUS_PER_WORKER_TUNE=${CPUS_PER_WORKER}

  echo "[run] Ray params: NUM_WORKERS=${NUM_WORKERS} NUM_WORKERS_TUNE=${NUM_WORKERS_TUNE} MAX_CONCURRENT_TRIALS=${MAX_CONCURRENT_TRIALS} GPUS_PER_WORKER=${GPUS_PER_WORKER} GPUS_PER_WORKER_TUNE=${GPUS_PER_WORKER_TUNE} CPUS_PER_WORKER=${CPUS_PER_WORKER} CPUS_PER_WORKER_TUNE=${CPUS_PER_WORKER_TUNE} (node_cpus=${TOTAL_CPUS_NODE} SKYPILOT_NUM_GPUS_PER_NODE=${SKYPILOT_NUM_GPUS_PER_NODE:-unset})"

  "${PYTHON_BIN}" /home/ray/app/repo/k3s/kuberay/main.py
