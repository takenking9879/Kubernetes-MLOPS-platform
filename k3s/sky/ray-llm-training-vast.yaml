# k3s/sky/ray-llm-training-vast.yaml
#
# LLM fine-tuning on Vast.ai via SkyPilot managed jobs.
# Provider template: vastai/pytorch (torch pre-installed — NOT reinstalled at runtime).
# HuggingFace TRL + PEFT LoRA + DeepSpeed ZeRO-3 installed at runtime.
#
# Spot-first on Vast.ai A100-80GB.
# Checkpoints synced to S3 every SAVE_STEPS for spot recovery.
#
# Usage:
#   sky jobs launch k3s/sky/ray-llm-training-vast.yaml \
#     --name qwen-vast \
#     --env LLM_TRAIN_RUN_ID=llm-test-001 \
#     --env LLM_MODEL_ID=Qwen/Qwen2.5-7B \
#     --env TRAIN_DATASET_S3=s3://k8s-mlops-platform-bucket/llm-data/train.jsonl \
#     --env MAX_STEPS=50 \
#     --yes
#
# Triggered by llm_training_dag.py when provider=vast.

name: ray-llm-training-vast

num_nodes: 1

resources:
  # Vast.ai PyTorch template — torch 2.10.0 (cu13.0) pre-installed.
  # DO NOT reinstall torch/CUDA at runtime.
  image_id: vastai/pytorch:2.10.0-cu130-cuda-13.1-mini-py311-2026-03-19
  any_of:
    - cloud: vast
      accelerators: A100-80GB:1
      use_spot: true
    - cloud: vast
      accelerators: A100:1
      use_spot: true
    - cloud: vast
      accelerators: A100-80GB:1
      use_spot: false
  disk_size: 200

envs:
  # ── Per-run parameters ──
  LLM_TRAIN_RUN_ID: ""
  LLM_MODEL_ID: "meta-llama/Llama-3.1-8B"
  HF_TOKEN: ""
  TRAIN_DATASET_S3: ""      # s3://bucket/path/train.jsonl

  # ── Training control ──
  MAX_SEQ_LEN: "2048"
  MAX_STEPS: "500"
  SAVE_STEPS: "100"
  PER_DEVICE_BATCH_SIZE: "1"
  GRADIENT_ACCUM_STEPS: "4"
  LEARNING_RATE: "2e-4"

  # ── LoRA ──
  LORA_ENABLED: "true"
  LORA_RANK: "8"

  # ── DeepSpeed ──
  USE_DEEPSPEED: "true"
  DEEPSPEED_STAGE: "3"

  # ── Spot recovery ──
  USE_SPOT: "true"

  # ── Infrastructure ──
  MLFLOW_TRACKING_URI: ""         # injected by Airflow DAG via task.update_envs()
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_DEFAULT_REGION: "us-east-1"
  S3_BUCKET: "k8s-mlops-platform-bucket"
  GPU_PRICE_PER_HOUR: "0"

  # ── GPU metrics ──
  SKY_CLUSTER_NAME: ""
  GRAFANA_REMOTE_WRITE_URL: ""
  GRAFANA_INSTANCE_ID: ""
  GRAFANA_API_KEY: ""

setup: |
  set -euo pipefail

  nvidia-smi || { echo "ERROR: nvidia-smi failed — GPU not attached"; exit 1; }

  if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo"; fi

  if ! command -v git >/dev/null 2>&1; then
    ${SUDO} apt-get update -qq
    ${SUDO} apt-get install -y --no-install-recommends git
    ${SUDO} rm -rf /var/lib/apt/lists/*
  fi

  if ! command -v uv >/dev/null 2>&1; then
    ${SUDO} python3 -m pip install --no-cache-dir uv
  fi

  # Clone repo (requirements_llm_runtime.txt lives here)
  if [ ! -d /home/ubuntu/app/repo/.git ]; then
    git clone --depth=1 --branch main \
      https://github.com/takenking9879/Kubernetes-MLOPS-platform.git \
      /home/ubuntu/app/repo
  else
    git -C /home/ubuntu/app/repo pull --ff-only origin main
  fi

  # Install HF stack — torch skipped (pre-installed in provider template)
  REQ_FILE="/home/ubuntu/app/repo/k3s/kuberay/gpu/requirements_llm_runtime.txt"
  [ -f "${REQ_FILE}" ] || { echo "ERROR: ${REQ_FILE} not found"; exit 1; }
  ${SUDO} uv pip install --system --no-cache -r "${REQ_FILE}"

  # Optional: Grafana Agent
  if [ -n "${GRAFANA_REMOTE_WRITE_URL:-}" ]; then
    AGENT_BIN=/usr/local/bin/grafana-agent
    if [ ! -f "${AGENT_BIN}" ]; then
      AGENT_VER=v0.43.3 ARCH=amd64
      curl -sL "https://github.com/grafana/agent/releases/download/${AGENT_VER}/grafana-agent-linux-${ARCH}.zip" \
        -o /tmp/grafana-agent.zip
      unzip -q /tmp/grafana-agent.zip -d /tmp/
      mv /tmp/grafana-agent-linux-${ARCH} "${AGENT_BIN}"
      chmod +x "${AGENT_BIN}"
    fi
  fi

  echo "Setup complete — LLM stack ready."

run: |
  set -e
  export PYTHONPATH=/home/ubuntu/app/repo:/home/ubuntu/app/repo/src

  python3 /home/ubuntu/app/repo/k3s/sky/gpu_exporter.py &
  echo "[run] GPU exporter started (PID=$!)"

  if [ -n "${GRAFANA_REMOTE_WRITE_URL:-}" ] && command -v grafana-agent >/dev/null 2>&1; then
    python3 /home/ubuntu/app/repo/k3s/sky/write_grafana_config.py
    grafana-agent --config.file=/tmp/grafana-agent-config.yaml &
    echo "[run] Grafana Agent started → ${GRAFANA_REMOTE_WRITE_URL}"
  fi

  python3 /home/ubuntu/app/repo/k3s/kuberay/llm_main.py
