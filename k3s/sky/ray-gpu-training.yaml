# k3s/sky/ray-gpu-training.yaml
#
# Single-node GPU training on RunPod via SkyPilot.
# Ray + all ML libs are pre-installed in the Docker image (no pip at runtime).
#
# Spot-first ordering: RTX2000-Ada spot → RTX4090 spot → A40 spot → on-demand fallbacks.
# Check current availability: `sky show-gpus --cloud runpod`
#
# Usage (manual test, from repo root):
#   sky launch k3s/sky/ray-gpu-training.yaml \
#     --name rtx2000-test \
#     --env TRAIN_RUN_ID=train-test-001 \
#     --env MODEL_TYPE=pytorch \
#     --env PARAMS_S3_PATH=s3://bucket/... \
#     --env AWS_ACCESS_KEY_ID=$(aws configure get aws_access_key_id) \
#     --env AWS_SECRET_ACCESS_KEY=$(aws configure get aws_secret_access_key) \
#     --yes
#
# Triggered automatically by training_dag_skypilot.py (sky.jobs.launch) when model_type == "pytorch".

name: ray-gpu-training

# Single-node: head + GPU worker on the same VM.
# The Ray head gets all GPUs (--num-gpus=SKYPILOT_NUM_GPUS_PER_NODE) so
# training tasks can schedule on the GPU from the head node directly.
num_nodes: 1

resources:
  # Image: k3s/kuberay/gpu/Dockerfile.e1
  # Contains: Ray 2.53.0, PyTorch 2.10 (cu128), XGBoost, MLflow, boto3 via uv
  image_id: runpod/pytorch:1.0.2-cu1281-torch280-ubuntu2404
  any_of:
    - infra: runpod/CA/CA-MTL-1
      accelerators: A40:1
      use_spot: true
    - infra: runpod/CA/CA-MTL-1
      accelerators: RTXA5000:1
    - infra: runpod/CA/CA-MTL-1
      accelerators: A40:1
      use_spot: false

  disk_size: 30

envs:
  # ── Per-run parameters (overridden at launch time by training_dag_skypilot.py) ──
  TRAIN_RUN_ID: ""
  PREPROCESS_RUN_ID: ""
  MODEL_TYPE: "pytorch"
  PARAMS_S3_PATH: ""
  PROCESSED_TABLE: ""

  # ── GPU control ──
  USE_GPU: "true"
  USE_SPOT: "true"
  USE_DEEPSPEED: "false"    # set to "true" to enable DeepSpeed ZeRO stage 1

  # ── Infrastructure ──
  MLFLOW_TRACKING_URI: ""         # injected by Airflow DAG via task.update_envs()
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_DEFAULT_REGION: "us-east-1"
  AWS_S3_ENDPOINT_URL: ""

  # ── GPU metrics (optional Grafana Cloud remote_write) ──
  GPU_PRICE_PER_HOUR: "0"   # injected by Airflow for cost tracking
  SKY_CLUSTER_NAME: ""      # injected by Airflow (cluster name for metric labels)
  GRAFANA_REMOTE_WRITE_URL: ""    # Grafana Cloud remote_write URL (leave empty to skip)
  GRAFANA_INSTANCE_ID: ""         # Grafana Cloud instance ID
  GRAFANA_API_KEY: ""             # Grafana Cloud API key

  # ── Ray training parameters ──
  NUM_WORKERS: "1"
  CPUS_PER_WORKER: "4"
  NUM_WORKERS_TUNE: "1"
  CPUS_PER_WORKER_TUNE: "4"
  MAX_CONCURRENT_TRIALS: "1"
  TUNE_MAX_TRAIN_ROWS: "250000"
  TUNE_MAX_VAL_ROWS: "150000"
  RAY_MATERIALIZE_DATASETS: "1"
  RAY_MATERIALIZE_DATASETS_TUNE: "1"
  PROMETHEUS_GRACE_SECONDS: "10"
  REPORT_FREQUENCY: "4"

  # ── Ray internals ──
  RAY_enable_infeasible_task_early_exit: "true"
  RAY_DEFAULT_OBJECT_STORE_MEMORY_PROPORTION: "0.7"
  RAY_ACCEL_ENV_VAR_OVERRIDE_ON_ZERO: "0"

# ── Dev/debug warm-cluster cache (MOUNT_CACHED) ──────────────────────────────
# Uncomment for repeated `sky exec` development runs to avoid re-downloading
# checkpoints from S3 on every launch.
# DO NOT enable for production managed jobs (sky.jobs.launch) — ephemeral
# clusters use Ray Train's storage_path=S3 for checkpoint recovery instead.
#
# file_mounts:
#   /tmp/ray_checkpoints:
#     source: s3://k8s-mlops-platform-bucket/sky-cache/${TRAIN_RUN_ID}/checkpoints
#     mode: MOUNT_CACHED
# ─────────────────────────────────────────────────────────────────────────────

setup: |
  set -euo pipefail

  nvidia-smi || { echo "ERROR: nvidia-smi failed - GPU not attached"; exit 1; }

  if [ "$(id -u)" -eq 0 ]; then
    SUDO=""
  else
    SUDO="sudo"
  fi

  # Match the expected Ray image layout (user + home + temp dirs).
  if ! id -u ray >/dev/null 2>&1; then
    ${SUDO} useradd -m -s /bin/bash -d /home/ray ray
  fi
  ${SUDO} mkdir -p /home/ray/app /home/ray/.cache/ray /tmp/ray
  ${SUDO} chown -R ray:ray /home/ray /tmp/ray

  if ! command -v git >/dev/null 2>&1; then
    ${SUDO} apt-get update -qq
    ${SUDO} apt-get install -y --no-install-recommends git
    ${SUDO} rm -rf /var/lib/apt/lists/*
  fi

  if [ ! -d /home/ray/app/repo/.git ]; then
    git clone --depth=1 --branch main \
      https://github.com/takenking9879/Kubernetes-MLOPS-platform.git \
      /home/ray/app/repo
  else
    git -C /home/ray/app/repo pull --ff-only origin main
  fi

  REQ_FILE="/home/ray/app/repo/k3s/kuberay/gpu/requirements_e1.txt"
  [ -f "${REQ_FILE}" ] || { echo "ERROR: requirements file not found: ${REQ_FILE}"; exit 1; }
  cp "${REQ_FILE}" /tmp/requirements_e1.txt

  # Install uv only if missing, then install repo requirements with uv.
  if ! command -v uv >/dev/null 2>&1; then
    ${SUDO} python3 -m pip install --no-cache-dir uv
  fi
  ${SUDO} uv pip install --system --no-cache \
    -r /tmp/requirements_e1.txt

  echo "Setup complete. Repo and requirements ready for Ray training."

  # ── GPU metrics exporter deps ──────────────────────────────────────────────
  # prometheus_client is already in requirements_e1.txt; install grafana-agent
  # binary only if Grafana Cloud remote_write is configured.
  if [ -n "${GRAFANA_REMOTE_WRITE_URL:-}" ]; then
    AGENT_BIN=/usr/local/bin/grafana-agent
    if [ ! -f "${AGENT_BIN}" ]; then
      AGENT_VER=v0.43.3 ARCH=amd64
      curl -sL "https://github.com/grafana/agent/releases/download/${AGENT_VER}/grafana-agent-linux-${ARCH}.zip" \
        -o /tmp/grafana-agent.zip
      unzip -q /tmp/grafana-agent.zip -d /tmp/
      mv /tmp/grafana-agent-linux-${ARCH} "${AGENT_BIN}"
      chmod +x "${AGENT_BIN}"
    fi
  fi

run: |
  set -e
  export PYTHONPATH=/home/ray/app/repo:/home/ray/app/repo/src

  # ── GPU metrics exporter (prometheus_client → :9400) ──────────────────────
  # Script lives in the repo so there's no heredoc inside the YAML block.
  python3 /home/ray/app/repo/k3s/sky/gpu_exporter.py &
  echo "[setup] GPU exporter started (PID=$!)"

  # Optional: Grafana Agent remote_write to Grafana Cloud.
  # Set GRAFANA_REMOTE_WRITE_URL (+ GRAFANA_INSTANCE_ID / GRAFANA_API_KEY)
  # and install grafana-agent in setup to enable.
  if [ -n "${GRAFANA_REMOTE_WRITE_URL:-}" ] && command -v grafana-agent >/dev/null 2>&1; then
    python3 /home/ray/app/repo/k3s/sky/write_grafana_config.py
    grafana-agent --config.file=/tmp/grafana-agent-config.yaml &
    echo "[setup] Grafana Agent started → ${GRAFANA_REMOTE_WRITE_URL}"
  fi

  # Start Ray head on port 6379 (SkyPilot uses 6380 internally).
  # Never use ray.init(address="auto") in training code.
  RAY_START_CMD="ray start --head \
    --port=6379 \
    --dashboard-port=8265 \
    --dashboard-host=0.0.0.0 \
    --disable-usage-stats \
    --include-dashboard=True"

  if [ "${SKYPILOT_NUM_GPUS_PER_NODE:-0}" -gt 0 ]; then
    RAY_START_CMD="${RAY_START_CMD} --num-gpus=${SKYPILOT_NUM_GPUS_PER_NODE}"
  fi

  eval "${RAY_START_CMD}"

  # Wait for Ray head to be healthy (up to 60 s)
  for i in $(seq 1 60); do
    ray health-check --address=127.0.0.1:6379 &>/dev/null && break
    echo "Waiting for Ray head ($i/60)"
    sleep 1
  done
  ray health-check --address=127.0.0.1:6379 \
    || { echo "ERROR: Ray head did not become healthy"; exit 1; }

  sleep 5

  python3 /home/ray/app/repo/k3s/kuberay/main.py