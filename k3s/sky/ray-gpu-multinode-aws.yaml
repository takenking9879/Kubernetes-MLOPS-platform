# k3s/sky/ray-gpu-multinode-aws.yaml
#
# Multi-node GPU training on AWS via SkyPilot managed jobs.
# Spot-first: p4d.24xlarge (8×A100-40GB, EFA/InfiniBand) → p3dn.24xlarge
# (8×V100-32GB, EFA) → A100 spot (any region) → on-demand fallbacks.
#
# EFA (Elastic Fabric Adapter) is the AWS equivalent of InfiniBand.
# Enabled automatically on p4d/p3dn via NCCL_IB_DISABLE=0.
#
# DeepSpeed ZeRO stage 1 is ON by default for multi-node (USE_DEEPSPEED=true).
# Ray FailureConfig (max_failures=3) activates automatically via USE_SPOT=true.
#
# Usage (manual test):
#   sky jobs launch k3s/sky/ray-gpu-multinode-aws.yaml \
#     --name test-multinode \
#     --env TRAIN_RUN_ID=train-test-mn-001 \
#     --env MODEL_TYPE=pytorch \
#     --env PARAMS_S3_PATH=s3://bucket/... \
#     --yes
#
# Risk: p4d.24xlarge spot availability is limited.
# Validate multi-node Ray with p3.8xlarge (4×V100, no EFA) first:
#   sky jobs launch ... --env OVERRIDE_INSTANCE=p3.8xlarge
#
# Triggered by training_dag_skypilot.py when num_nodes > 1.

name: ray-gpu-multinode

num_nodes: 2

resources:
  # Custom image — all deps baked in (torch 2.10.0 cu128, ray 2.53.0, deepspeed 0.18.8, xgboost).
  image_id: docker:takenking9879/ray-train:2.53.0
  ordered:
    # Spot-first — EFA-capable (InfiniBand equivalent on AWS)
    - cloud: aws
      instance_type: p4d.24xlarge    # 8×A100-40GB, 400 Gbps EFA
      use_spot: true
    - cloud: aws
      instance_type: p3dn.24xlarge   # 8×V100-32GB, 100 Gbps EFA
      use_spot: true
    # Non-EFA spot fallback (validates multi-node Ray without EFA cost)
    - cloud: aws
      instance_type: p3.8xlarge      # 4×V100-16GB, no EFA
      use_spot: true
    # On-demand fallbacks
    - cloud: aws
      instance_type: p4d.24xlarge
      use_spot: false
    - cloud: aws
      instance_type: p3dn.24xlarge
      use_spot: false
  disk_size: 100

envs:
  # ── Per-run parameters ──
  TRAIN_RUN_ID: ""
  PREPROCESS_RUN_ID: ""
  MODEL_TYPE: "pytorch"
  PARAMS_S3_PATH: ""
  PROCESSED_TABLE: ""

  # ── GPU / training control ──
  USE_GPU: "true"
  USE_SPOT: "true"
  USE_DEEPSPEED: "true"             # ZeRO stage 1 on by default for multi-node

  # ── NCCL / EFA (InfiniBand) ──
  NCCL_DEBUG: "INFO"
  NCCL_IB_DISABLE: "0"             # Enable InfiniBand / EFA
  NCCL_SOCKET_IFNAME: "eth0"
  FI_EFA_USE_DEVICE_RDMA: "1"      # AWS EFA RDMA for p4d
  RDMAV_FORK_SAFE: "1"

  # ── Infrastructure ──
  MLFLOW_TRACKING_URI: ""         # injected by Airflow DAG via task.update_envs()
  AWS_DEFAULT_REGION: "us-east-1"
  AWS_S3_ENDPOINT_URL: ""

  # ── GPU metrics (optional Grafana Cloud remote_write) ──
  GPU_PRICE_PER_HOUR: "0"   # injected by Airflow for cost tracking
  SKY_CLUSTER_NAME: ""      # injected by Airflow (cluster name for metric labels)
  GRAFANA_REMOTE_WRITE_URL: ""
  GRAFANA_INSTANCE_ID: ""
  GRAFANA_API_KEY: ""

  # ── Ray training parameters ──
  # These are fallback defaults. The Airflow DAG injects the correct values
  # based on num_nodes × num_gpus_per_node before launching. The run script
  # further overrides using SKYPILOT_NUM_NODES × SKYPILOT_NUM_GPUS_PER_NODE for direct launches.
  NUM_WORKERS: "2"           # DAG injects: multi-node workers = nodes
  CPUS_PER_WORKER: "6"
  NUM_WORKERS_TUNE: "1"      # DAG injects: 1 worker per tuning trial
  CPUS_PER_WORKER_TUNE: "6"
  MAX_CONCURRENT_TRIALS: "2" # DAG injects: same as workers
  TUNE_MAX_TRAIN_ROWS: "500000"
  TUNE_MAX_VAL_ROWS: "200000"
  RAY_MATERIALIZE_DATASETS: "1"
  REPORT_FREQUENCY: "4"
  RAY_enable_infeasible_task_early_exit: "true"
  RAY_DEFAULT_OBJECT_STORE_MEMORY_PROPORTION: "0.6"

setup: |
  set -e

  nvidia-smi || { echo "ERROR: nvidia-smi failed — GPU not attached"; exit 1; }

  # All Python deps are baked into the image (ray-train:2.53.0).
  # Only clone repo on every node — no pip install needed.
  mkdir -p /home/ray/app
  if [ ! -d /home/ray/app/repo ]; then
    git clone --depth=1 --branch main \
      https://github.com/takenking9879/Kubernetes-MLOPS-platform.git \
      /home/ray/app/repo
  fi
  echo "Repo ready: $(ls /home/ray/app/repo/k3s/kuberay/)"

  # Optional: Grafana Agent binary for remote_write to Grafana Cloud
  if [ -n "${GRAFANA_REMOTE_WRITE_URL:-}" ]; then
    AGENT_BIN=/usr/local/bin/grafana-agent
    if [ ! -f "${AGENT_BIN}" ]; then
      AGENT_VER=v0.43.3 ARCH=amd64
      curl -sL "https://github.com/grafana/agent/releases/download/${AGENT_VER}/grafana-agent-linux-${ARCH}.zip" \
        -o /tmp/grafana-agent.zip
      unzip -q /tmp/grafana-agent.zip -d /tmp/
      mv /tmp/grafana-agent-linux-${ARCH} "${AGENT_BIN}"
      chmod +x "${AGENT_BIN}"
    fi
  fi

run: |
  set -e
  export PYTHONPATH=/home/ray/app/repo:/home/ray/app/repo/src

  HEAD_IP=$(echo "${SKYPILOT_NODE_IPS}" | head -n1)
  NUM_GPUS=${SKYPILOT_NUM_GPUS_PER_NODE:-8}
  NUM_CPUS=${SKYPILOT_NUM_CPUS_PER_NODE:-48}

  if [ "${SKYPILOT_NODE_RANK}" -eq 0 ]; then
    # ── Head node: start Ray head (no GPUs on head — workers own the GPUs) ──
    ray start --head \
      --port=6379 \
      --dashboard-port=8265 \
      --dashboard-host=0.0.0.0 \
      --num-gpus=0 \
      --num-cpus=4 \
      --disable-usage-stats

    # Wait for all worker nodes to register their GPUs
    python3 /home/ray/app/repo/k3s/sky/wait_for_workers.py

    # GPU metrics exporter (head node — all GPU labels include cluster/is_spot)
    python3 /home/ray/app/repo/k3s/sky/gpu_exporter.py &
    echo "[setup] GPU exporter started (PID=$!)"
    if [ -n "${GRAFANA_REMOTE_WRITE_URL:-}" ] && command -v grafana-agent >/dev/null 2>&1; then
      python3 /home/ray/app/repo/k3s/sky/write_grafana_config.py
      grafana-agent --config.file=/tmp/grafana-agent-config.yaml &
    fi

    # ── GPU-aware fallback (primary values injected by Airflow DAG via envs) ──
    # If the DAG already set NUM_WORKERS, NUM_WORKERS_TUNE, MAX_CONCURRENT_TRIALS,
    # the ${VAR:-default} syntax keeps those values unchanged.
    # For direct sky launches (bypassing the DAG), derives from SKYPILOT_* runtime vars.
    GPUS_PER_NODE=${SKYPILOT_NUM_GPUS_PER_NODE:-8}
    TOTAL_NODES=${SKYPILOT_NUM_NODES:-2}
    TOTAL_GPUS=$(( TOTAL_NODES * GPUS_PER_NODE ))
    export NUM_WORKERS=${NUM_WORKERS:-${TOTAL_NODES}}
    export NUM_WORKERS_TUNE=${NUM_WORKERS_TUNE:-1}
    export MAX_CONCURRENT_TRIALS=${MAX_CONCURRENT_TRIALS:-${NUM_WORKERS}}
    export GPUS_PER_WORKER=${GPUS_PER_WORKER:-${GPUS_PER_NODE}}
    export GPUS_PER_WORKER_TUNE=${GPUS_PER_WORKER_TUNE:-${GPUS_PER_WORKER}}

    TOTAL_CPUS_NODE=$(nproc 2>/dev/null || getconf _NPROCESSORS_ONLN 2>/dev/null || echo 1)
    _cpus_per_worker_uniform_with_leftover() {
      local total_cpus="${1:-1}"
      local workers="${2:-1}"
      if [ "${workers}" -le 0 ]; then
        workers=1
      fi
      local base=$(( total_cpus / workers ))
      local rem=$(( total_cpus % workers ))
      local out="${base}"
      if [ "${rem}" -eq 0 ]; then
        out=$(( base - 1 ))
      fi
      if [ "${out}" -lt 1 ]; then
        out=1
      fi
      echo "${out}"
    }

    # In multi-node mode with workers=nodes, keep one worker per node.
    TRAIN_WORKERS_PER_NODE=1
    export CPUS_PER_WORKER=$(_cpus_per_worker_uniform_with_leftover "${TOTAL_CPUS_NODE}" "${TRAIN_WORKERS_PER_NODE}")
    export CPUS_PER_WORKER_TUNE=${CPUS_PER_WORKER}

    echo "[run] Ray params: NUM_WORKERS=${NUM_WORKERS} NUM_WORKERS_TUNE=${NUM_WORKERS_TUNE} MAX_CONCURRENT_TRIALS=${MAX_CONCURRENT_TRIALS} GPUS_PER_WORKER=${GPUS_PER_WORKER} GPUS_PER_WORKER_TUNE=${GPUS_PER_WORKER_TUNE} CPUS_PER_WORKER=${CPUS_PER_WORKER} CPUS_PER_WORKER_TUNE=${CPUS_PER_WORKER_TUNE} (node_cpus=${TOTAL_CPUS_NODE} nodes=${TOTAL_NODES} gpus_per_node=${GPUS_PER_NODE})"

    python3 /home/ray/app/repo/k3s/kuberay/main.py

  else
    # ── Worker nodes: join the Ray cluster ──
    echo "Worker rank ${SKYPILOT_NODE_RANK}: waiting for head at ${HEAD_IP}:6379"
    for i in $(seq 1 30); do
      ray health-check --address="${HEAD_IP}:6379" &>/dev/null && break
      echo "Head not ready yet ($i/30)..."
      sleep 10
    done

    ray start \
      --address="${HEAD_IP}:6379" \
      --num-gpus="${NUM_GPUS}" \
      --num-cpus="${NUM_CPUS}" \
      --node-ip-address="$(hostname -I | awk '{print $1}')" \
      --disable-usage-stats \
      --block
  fi
