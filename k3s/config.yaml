# ============================================================================
# STATIC INFRASTRUCTURE CONFIG
# This file does NOT change per execution. Commit it to the repo.
# Per-run parameters live in params.yaml (generated by the UI and exported to S3).
# ============================================================================

mlflow:
  tracking_uri: "http://my-mlflow"
  artifact_base: "s3://k8s-mlops-platform-bucket/mlflow-artifacts"
  # artifact_location for a given experiment is derived as:
  #   artifact_base + "/" + experiment_name

iceberg:
  warehouse: "s3://k8s-mlops-platform-bucket/warehouse"
  metadata_table: "iceberg.metadata.preprocessing_artifacts"

s3:
  bucket: "k8s-mlops-platform-bucket"
  pipelines_prefix: "pipelines"       # s3://bucket/pipelines/{pipeline_hash}/
  dsl_prefix: "dsl"                   # s3://bucket/dsl/dsl_{dataset}/v{N}.yaml
  schemas_prefix: "schemas"           # s3://bucket/schemas/datasets/{dataset}/
  params_prefix: "params"             # s3://bucket/params/{execution_id}/params.yaml

serving:
  webhook_base_url: "http://model-serving-serve-svc.ray.svc.cluster.local:8000"
  webhook_path: "/infer/webhook"
  webhook_name: "rayserve-attack-detection-champion-alias"
  webhook_max_timestamp_age_seconds: 300
  alias: "champion"
  canary_alias: "challenger"
  canary_probability: 0.10
