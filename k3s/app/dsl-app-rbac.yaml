apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-submit-role
  namespace: spark
rules:
  - apiGroups: ["spark.apache.org"]
    resources: ["sparkapplications"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-submit-rolebinding
  namespace: spark
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spark-submit-role
subjects:
  - kind: ServiceAccount
    name: default
    namespace: apps
