apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsl-app
  namespace: apps
  labels:
    app: dsl-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dsl-app
  template:
    metadata:
      labels:
        app: dsl-app
    spec:
      containers:
        - name: backend
          image: dsl-app:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cd /workspace/backend && uvicorn main:app --host 0.0.0.0 --port 8000"]
          ports:
            - name: backend
              containerPort: 8000
          envFrom:
            - secretRef:
                name: env-secret
          env:
            - name: PYTHONPATH
              value: /git-data/repo:/git-data/repo/src
          volumeMounts:
            - name: job-files
              mountPath: /git-data
          readinessProbe:
            httpGet:
              path: /api/health
              port: backend
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: backend
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

        - name: frontend
          image: dsl-app:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command: ["sh", "-c", "cd /workspace/frontend && npm run dev -- --host 0.0.0.0 --port 5173"]
          ports:
            - name: frontend
              containerPort: 5173
          env:
            - name: VITE_API_URL
              value: "http://localhost:8000"
          readinessProbe:
            httpGet:
              path: /
              port: frontend
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: frontend
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

      initContainers:
        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.1.0
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          env:
            - name: GITSYNC_REPO
              value: "https://github.com/takenking9879/Kubernetes-MLOPS-platform"
            - name: GIT_SYNC_BRANCH
              value: "main"
            - name: GIT_SYNC_ROOT
              value: "/git"
            - name: GIT_SYNC_DEST
              value: "repo"
            - name: GIT_SYNC_WAIT
              value: "30"
            - name: GITSYNC_ONE_TIME
              value: "true"
          volumeMounts:
            - name: job-files
              mountPath: /git

      volumes:
        - name: job-files
          emptyDir: {}
