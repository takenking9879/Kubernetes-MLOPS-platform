apiVersion: v1
kind: Service
metadata:
  name: spark-kafka-app-driver-svc
  namespace: spark
  labels:
    app: spark-kafka-app
spec:
  type: ClusterIP
  selector:
    spark-app-selector: spark-kafka-app-0
    spark-role: driver
  ports:
    - name: metrics
      port: 8000
      targetPort: 8000
    - name: spark-ui
      port: 4040
      targetPort: 4040
