apiVersion: spark.apache.org/v1
kind: SparkApplication
metadata:
  name: spark-kafka-app
  namespace: spark
spec:
  pyFiles: "local:///app/repo/k3s/spark/inference/kafka_main.py"

  runtimeVersions:
    sparkVersion: "4.0.1"



  # Spark confs (Kafka + streaming con S3 checkpoint)
  sparkConf:
    spark.kubernetes.container.image: k3s-kafka-inference:latest
    spark.driver.memory: "512m"
    spark.driver.cores: "1"
    spark.executor.memory: "512m"
    spark.executor.cores: "2"
    spark.dynamicAllocation.enabled: "true"
    spark.dynamicAllocation.minExecutors: "1"
    spark.dynamicAllocation.maxExecutors: "3"
    spark.dynamicAllocation.initialExecutors: "2"
    spark.dynamicAllocation.shuffleTracking.enabled: "true"
    spark.speculation.interval: "30"
    spark.kubernetes.authenticate.driver.serviceAccountName: "spark"

    # ===== PROMETHEUS METRICS =====
    spark.ui.prometheus.enabled: "true"
    spark.metrics.conf.*.sink.prometheusServlet.class: "org.apache.spark.metrics.sink.PrometheusServlet"
    spark.metrics.conf.*.sink.prometheusServlet.path: "/metrics/prometheus"

    # Streaming optimizations
    spark.sql.streaming.schemaInference: "true"
    spark.streaming.stopGracefullyOnShutdown: "true"

    # Checkpoint en S3
    spark.sql.streaming.checkpointLocation: "s3a://k8s-mlops-platform-bucket/checkpoints/spark-kafka-app"
    spark.hadoop.fs.s3a.impl: org.apache.hadoop.fs.s3a.S3AFileSystem
    spark.hadoop.fs.s3a.aws.credentials.provider: com.amazonaws.auth.DefaultAWSCredentialsProviderChain
    spark.hadoop.fs.s3a.endpoint: s3.us-east-2.amazonaws.com
    spark.hadoop.fs.s3a.aws.region: us-east-2
    spark.hadoop.fs.s3a.fast.upload: "true"
    #spark.hadoop.fs.s3a.multipart.size: "104857600"
    spark.hadoop.fs.s3a.connection.maximum: "100"
    spark.hadoop.fs.s3a.path.style.access: "true"
    # Ensure PYTHONPATH includes locations where git-sync places the repo
    # driver/executor mount the shared volume at /app while git-sync writes to /git/repo
    spark.kubernetes.driverEnv.PYTHONPATH: "/app:/app/repo:/app/repo/k3s:/opt/spark/work-dir:/opt/spark/work-dir/k3s"
    spark.kubernetes.executorEnv.PYTHONPATH: "/app:/app/repo:/app/repo/k3s:/opt/spark/work-dir:/opt/spark/work-dir/k3s"
    spark.kubernetes.driverEnv.RAY_SERVE_URL: "http://model-serving-serve-svc.ray.svc.cluster.local:8000/infer"
    spark.kubernetes.executorEnv.RAY_SERVE_URL: "http://model-serving-serve-svc.ray.svc.cluster.local:8000/infer"
    spark.kubernetes.driverEnv.PROMETHEUS_PORT: "8000"

  # Driver spec
  driverSpec:
    podTemplateSpec:
      metadata:
        labels:
          app: spark-kafka-app
      spec:
        containers:
          - name: spark-kubernetes-driver
            image: k3s-kafka-inference:latest
            volumeMounts:
              - name: app-files
                mountPath: /app
            envFrom:
              - secretRef:
                  name: env-secret

        initContainers:
          - name: git-sync
            image: registry.k8s.io/git-sync/git-sync:v4.1.0
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 200m
                memory: 256Mi
            env:
              - name: GITSYNC_REPO
                value: "https://github.com/takenking9879/Kubernetes-MLOPS-platform"
              - name: GIT_SYNC_BRANCH
                value: "main"
              - name: GIT_SYNC_ROOT
                value: "/git"
              - name: GIT_SYNC_DEST
                value: "repo"
              - name: GIT_SYNC_WAIT
                value: "30"
              - name: GITSYNC_ONE_TIME
                value: "true"
            volumeMounts:
              - name: app-files
                mountPath: /git

        volumes:
          - name: app-files
            emptyDir: {}

  # Executor spec
  executorSpec:
    podTemplateSpec:
      metadata:
        labels:
          app: spark-kafka-app
      spec:
        containers:
          - name: spark-kubernetes-executor
            image: k3s-kafka-inference:latest
            volumeMounts:
              - name: app-files
                mountPath: /app
            envFrom:
              - secretRef:
                  name: env-secret

        initContainers:
          - name: git-sync
            image: registry.k8s.io/git-sync/git-sync:v4.1.0
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 200m
                memory: 256Mi
            env:
              - name: GITSYNC_REPO
                value: "https://github.com/takenking9879/Kubernetes-MLOPS-platform"
              - name: GIT_SYNC_BRANCH
                value: "main"
              - name: GIT_SYNC_ROOT
                value: "/git"
              - name: GIT_SYNC_DEST
                value: "repo"
              - name: GIT_SYNC_WAIT
                value: "30"
              - name: GITSYNC_ONE_TIME
                value: "true"
            volumeMounts:
              - name: app-files
                mountPath: /git

        volumes:
          - name: app-files
            emptyDir: {}
