apiVersion: ray.io/v1
kind: RayService
metadata:
  name: model-serving
  namespace: ray
spec:
  # Conservative health thresholds for model loading + cold starts.
  serviceUnhealthySecondThreshold: 900
  deploymentUnhealthySecondThreshold: 900

  # Ray Serve application: serving only (no Kafka).
  serveConfigV2: |
    applications:
      - name: inference
        import_path: k3s.kuberay.serving.app:deployment_graph
        route_prefix: /infer
        deployments:
          - name: ModelRouter
            ray_actor_options:
              num_cpus: 0.05
            max_ongoing_requests: 128
            user_config: {}
            autoscaling_config:
              min_replicas: 4
              initial_replicas: 4
              max_replicas: 16
              target_ongoing_requests: 16
              upscale_delay_s: 0
              downscale_delay_s: 15
          - name: StableModel
            ray_actor_options:
              num_cpus: 0.25
            max_ongoing_requests: 64
            user_config: {}
            autoscaling_config:
              min_replicas: 4
              initial_replicas: 4
              max_replicas: 12
              target_ongoing_requests: 8
              upscale_delay_s: 0
              downscale_delay_s: 15
          - name: CanaryModel
            ray_actor_options:
              num_cpus: 0.25
            max_ongoing_requests: 64
            user_config: {}
            autoscaling_config:
              min_replicas: 0
              initial_replicas: 0
              max_replicas: 8
              target_ongoing_requests: 8
              upscale_delay_s: 0
              downscale_delay_s: 15
  rayClusterConfig:
    rayVersion: "2.53.0"
    enableInTreeAutoscaling: true
    autoscalerOptions:
      version: v2
      upscalingMode: Default
      idleTimeoutSeconds: 60

    headGroupSpec:
      rayStartParams:
        dashboard-host: "0.0.0.0"
        # Best practice: keep head free of CPU workloads.
        num-cpus: "0"
      template:
        spec:
          containers:
            - name: ray-head
              image: ray-cluster:2.53.0
              ports:
                - containerPort: 6379
                  name: gcs-server
                - containerPort: 8265
                  name: dashboard
                - containerPort: 10001
                  name: client
                - containerPort: 8000
                  name: serve
              envFrom:
                - secretRef:
                    name: env-secret
              env:
                - name: PYTHONPATH
                  value: /home/ray/app/repo:/home/ray/app/repo/src
              resources:
                requests:
                  cpu: "500m"
                  memory: "1Gi"
                limits:
                  cpu: "1"
                  memory: "2Gi"
              volumeMounts:
                - name: job-files
                  mountPath: /home/ray/app

          initContainers:
            - name: git-sync
              image: registry.k8s.io/git-sync/git-sync:v4.1.0
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              env:
                - name: GITSYNC_REPO
                  value: "https://github.com/takenking9879/Kubernetes-MLOPS-platform"
                - name: GIT_SYNC_BRANCH
                  value: "main"
                - name: GIT_SYNC_ROOT
                  value: "/git"
                - name: GIT_SYNC_DEST
                  value: "repo"
                - name: GIT_SYNC_WAIT
                  value: "30"
                - name: GITSYNC_ONE_TIME
                  value: "true"
              volumeMounts:
                - name: job-files
                  mountPath: /git

          volumes:
            - name: job-files
              emptyDir: {}

    workerGroupSpecs:
      - groupName: serve-workers
        replicas: 3
        minReplicas: 2
        maxReplicas: 8
        rayStartParams: {}
        template:
          spec:
            containers:
              - name: ray-worker
                image: ray-cluster:2.53.0
                envFrom:
                  - secretRef:
                      name: env-secret
                env:
                  - name: PYTHONPATH
                    value: /home/ray/app/repo:/home/ray/app/repo/src
                resources:
                  requests:
                    cpu: "1"
                    memory: "2Gi"
                  limits:
                    cpu: "2"
                    memory: "3Gi"
                volumeMounts:
                  - name: job-files
                    mountPath: /home/ray/app

            initContainers:
              - name: git-sync
                image: registry.k8s.io/git-sync/git-sync:v4.1.0
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    cpu: 200m
                    memory: 256Mi
                env:
                  - name: GITSYNC_REPO
                    value: "https://github.com/takenking9879/Kubernetes-MLOPS-platform"
                  - name: GIT_SYNC_BRANCH
                    value: "main"
                  - name: GIT_SYNC_ROOT
                    value: "/git"
                  - name: GIT_SYNC_DEST
                    value: "repo"
                  - name: GIT_SYNC_WAIT
                    value: "30"
                  - name: GITSYNC_ONE_TIME
                    value: "true"
                volumeMounts:
                  - name: job-files
                    mountPath: /git

            volumes:
              - name: job-files
                emptyDir: {}
