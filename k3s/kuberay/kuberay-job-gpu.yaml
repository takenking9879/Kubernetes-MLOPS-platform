apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: ray-gpu-test-job
  namespace: ray
spec:
  entrypoint: "python3 /home/ray/gpu_test_main.py"
  rayClusterSpec:
    rayVersion: '2.53.0'
    enableInTreeAutoscaling: true
    headGroupSpec:
      serviceType: NodePort # Use this for local nodes
      rayStartParams:
        dashboard-host: '0.0.0.0'
        num-cpus: '1'
        num-gpus: '0'
      template:
        spec:
          containers:
            - name: ray-head
              image: ray-cluster-gpu:2.53.0
              env:
                - name: RAY_gcs_rpc_server_reconnect_timeout_s
                  value: "300"
                - name: RAY_raylet_death_check_interval_ms
                  value: "1000"
                - name: RAY_num_gcs_missed_heartbeat_limit
                  value: "30"
                - name: RAY_enable_infeasible_task_early_exit
                  value: "true"
              ports:
                - containerPort: 6379
                  name: gcs-server
                - containerPort: 8265
                  name: dashboard
                - containerPort: 10001
                  name: client
              volumeMounts:
                - mountPath: /home/ray/gpu_test_main.py
                  name: python-script
                  subPath: gpu_test_main.py
          volumes:
            - name: python-script
              configMap:
                name: gpu-test-script
    workerGroupSpecs:
    - replicas: 1
      minReplicas: 1
      maxReplicas: 2
      groupName: gpu-group
      rayStartParams:
        num-gpus: '1'
        num-cpus: '2'
      template:
        spec:
          # Target the RunPod virtual kubelet node (--node-name=vk-ml-runpod).
          nodeSelector:
            kubernetes.io/hostname: vk-ml-runpod
          # Required to schedule onto the virtual kubelet node.
          tolerations:
          - key: "virtual-kubelet.io/provider"
            operator: "Exists"
            effect: "NoSchedule"
          containers:
          - name: ray-worker
            image: ray-cluster-gpu:2.53.0
            resources:
              limits:
                cpu: "2"
                memory: "8G"
                nvidia.com/gpu: "1"
              requests:
                cpu: "2"
                memory: "8G"
                nvidia.com/gpu: "1"
            volumeMounts:
              - mountPath: /tmp/ray
                name: ray-logs
          volumes:
          - name: ray-logs
            emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-test-script
  namespace: ray
data:
  gpu_test_main.py: |
    import ray
    import torch
    import torch.nn as nn
    import torch.optim as optim
    import time
    import sys

    # Set CPU to 0 to avoid the "Infeasible Task" error if worker doesn't report CPUs
    @ray.remote(num_gpus=1, num_cpus=0)
    def train_gpu_task():
        device = torch.device("cuda" if torch.cuda.is_available() else "cpu")
        print(f"Device being used: {device}")
        
        if not torch.cuda.is_available():
            raise RuntimeError("Error: CUDA not available on this worker")

        print(f"CUDA Available: {torch.cuda.is_available()}")
        print(f"GPU Count: {torch.cuda.device_count()}")
        print(f"GPU Name: {torch.cuda.get_device_name(0)}")

        # Minimal Neural Network
        model = nn.Linear(10, 1).to(device)
        criterion = nn.MSELoss()
        optimizer = optim.SGD(model.parameters(), lr=0.01)

        # Synthetic Data
        torch.manual_seed(42)
        inputs = torch.randn(64, 10).to(device)
        targets = torch.randn(64, 1).to(device)

        # Minimal Training Loop
        for epoch in range(5):
            optimizer.zero_grad()
            outputs = model(inputs)
            loss = criterion(outputs, targets)
            loss.backward()
            optimizer.step()
            print(f"Epoch {epoch+1}, Loss: {loss.item():.4f}")
        
        return f"Training finished on GPU: {torch.cuda.get_device_name(0)}"

    if __name__ == "__main__":
        print("Initialising Ray...")
        ray.init(address="auto")
        
        print("Waiting for GPU worker to join... (max 120s)")
        for i in range(12):
            resources = ray.cluster_resources()
            if "GPU" in resources and resources["GPU"] > 0:
                print(f"GPU resources detected: {resources['GPU']}")
                break
            time.sleep(10)
            print(f"Still waiting for GPU worker... step {i+1}")
        else:
            print("Timeout: No GPU resources found.")
            sys.exit(1)

        print("Submitting GPU task...")
        result_ref = train_gpu_task.remote()
        
        try:
            result = ray.get(result_ref, timeout=300)
            print(f"Success: {result}")
        except Exception as e:
            print(f"Task failed: {e}")
            sys.exit(1)
---
apiVersion: v1
kind: Service
metadata:
  name: ray-gpu-test-head
  namespace: ray
spec:
  # ClusterIP: RunPod workers reach this service via the Tailscale subnet router.
  # The K3s node must advertise its service CIDR (10.43.0.0/16) so workers that
  # join the tailnet with --accept-routes can reach ClusterIPs directly.
  # A Tailscale MagicDNS custom A record (ray-head.<tailnet>.ts.net → ClusterIP)
  # maps a stable human-readable name to this service's ClusterIP.
  type: ClusterIP
  ports:
    - name: gcs
      port: 6379
      targetPort: 6379
    - name: dashboard
      port: 8265
      targetPort: 8265
  selector:
    ray.io/node-type: head
    # Do NOT add ray.io/cluster here — KubeRay generates a random suffix on each
    # RayJob run (e.g. ray-gpu-test-job-wm9mw), so a hardcoded cluster name will
    # never match and the service will have no endpoints.
