# ============================================================
# RayJob — External GPU worker variant
# ============================================================
#
# Designed for two scenarios:
#
#   Phase 0 — Local Docker Desktop PoC
#     GPU runs in a Docker container outside Kubernetes.
#     No Tailscale needed; Docker --network=host can reach pod IPs directly.
#
#     Usage:
#       1. kubectl apply -f k3s/kuberay/kuberay-job-gpu-runpod.yaml
#       2. HEAD_IP=$(kubectl get pod -n ray -l ray.io/node-type=head \
#                    -o jsonpath='{.items[0].status.podIP}')
#          HOST_IP=$(docker run --rm --network=host alpine \
#                    ip route get 8.8.8.8 | awk '{print $7; exit}')
#          docker run --rm --gpus all --network=host \
#            -e PYTHONPATH=/home/ray/app/repo:/home/ray/app/repo/src \
#            ray-cluster-gpu:2.53.0 \
#            ray start \
#              --address="${HEAD_IP}:6379" \
#              --num-gpus=1 \
#              --node-ip-address="${HOST_IP}" \
#              --min-worker-port=20000 \
#              --max-worker-port=20020 \
#              --block
#       3. kubectl apply -f (trigger via Airflow training_dag_gpu)
#
#   Phase 1 — RunPod remote GPU via Tailscale
#     See k3s/runpod/ for Dockerfile, startup script, and helpers.
#     Tailscale Operator must be installed in the cluster (see plan docs).
#     The training_dag_gpu.py DAG handles RunPod provisioning automatically.
#
# TOPOLOGY:
#
#   ┌─────────────────────────────────────────────────────┐
#   │  [head pod]   num-cpus:0, num-gpus:0                │
#   │  [no K8s GPU workers — GPU provided externally]     │
#   │  External worker joins:                             │
#   │    ray start --address=<head-ip>:6379               │
#   │              --num-gpus=1 --block                   │
#   └─────────────────────────────────────────────────────┘
#
# ============================================================
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: kuberay-job-gpu
  namespace: ray
spec:
  entrypoint: python3 /home/ray/app/repo/k3s/kuberay/main.py

  shutdownAfterJobFinishes: true
  ttlSecondsAfterFinished: 60

  runtimeEnvYAML: |
    env_vars:
      # ── 1 GPU worker (external Docker container or RunPod pod) ────────────
      NUM_WORKERS: "1"
      CPUS_PER_WORKER: "10"

      NUM_WORKERS_TUNE: "1"
      CPUS_PER_WORKER_TUNE: "6"

      # Single GPU: keep concurrent trials at 1 to avoid VRAM contention.
      MAX_CONCURRENT_TRIALS: "1"

      TUNE_MAX_TRAIN_ROWS: "250000"
      TUNE_MAX_VAL_ROWS: "150000"

      RAY_MATERIALIZE_DATASETS: "1"
      RAY_MATERIALIZE_DATASETS_TUNE: "1"

      PROMETHEUS_GRACE_SECONDS: "10"
      REPORT_FREQUENCY: "4"

  rayClusterSpec:
    rayVersion: "2.53.0"
    enableInTreeAutoscaling: false
    autoscalerOptions:
      version: v2
      upscalingMode: Default
      idleTimeoutSeconds: 60

    ########################
    # HEAD — no GPU, no CPU tasks
    ########################
    headGroupSpec:
      rayStartParams:
        num-cpus: "0"
        num-gpus: "0"
      template:
        metadata:
          labels:
            app: kuberay-training-gpu
        spec:
          containers:
            - name: ray-head
              image: ray-cluster-gpu:2.53.0
              ports:
                - containerPort: 6379
                  name: gcs-server
                - containerPort: 8265
                  name: dashboard
                - containerPort: 10001
                  name: client
                - containerPort: 8002
                  name: metrics
              resources:
                limits:
                  cpu: "2"
                  memory: "3Gi"
                requests:
                  cpu: "1"
                  memory: "3Gi"
              volumeMounts:
                - name: job-files
                  mountPath: /home/ray/app
              envFrom:
                - secretRef:
                    name: env-secret
              env:
                - name: RAY_enable_infeasible_task_early_exit
                  value: "true"
                - name: RAY_DEFAULT_OBJECT_STORE_MEMORY_PROPORTION
                  value: "0.7"
                - name: RAY_ACCEL_ENV_VAR_OVERRIDE_ON_ZERO
                  value: "0"
                - name: PYTHONPATH
                  value: /home/ray/app/repo:/home/ray/app/repo/src

          initContainers:
            - name: git-sync
              image: registry.k8s.io/git-sync/git-sync:v4.1.0
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              env:
                - name: GITSYNC_REPO
                  value: "https://github.com/takenking9879/Kubernetes-MLOPS-platform"
                - name: GIT_SYNC_BRANCH
                  value: "main"
                - name: GIT_SYNC_ROOT
                  value: "/git"
                - name: GIT_SYNC_DEST
                  value: "repo"
                - name: GIT_SYNC_WAIT
                  value: "30"
                - name: GITSYNC_ONE_TIME
                  value: "true"
              volumeMounts:
                - name: job-files
                  mountPath: /git

          volumes:
            - name: job-files
              emptyDir: {}

    ########################
    # NO K8s GPU workers
    # External GPU worker joins via:
    #   ray start --address=<head-pod-ip>:6379 --num-gpus=1 --block
    ########################
    workerGroupSpecs: []
